<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Digit Sum</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     93 · Digit sum
     (digit sum → single digit · dividing by 3 and 9)
     ============================================================ */
  .ttl { flex: none; font-size: 25px; line-height: 1.1; white-space: nowrap; }
  .sub { flex: none; margin-top: 2px; font-size: 14px; letter-spacing: 2px; }

  /* ---------- definition ---------- */
  .def {
    flex: none;
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 12px;
    background: #fffdf4;
    border: 1px solid #f2e6bd;
    box-shadow: 0 4px 10px rgba(120, 100, 40, .05);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 14px;
    line-height: 1.32;
    color: #6f6650;
  }
  .def .dot { flex: none; width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: #f6c945; }
  .def b { color: #8a5b00; }

  /* ---------- sections ---------- */
  .sec {
    flex: none;
    margin-top: 5px;
    padding: 5px 10px 5px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 5px 12px rgba(30, 80, 80, .07);
  }
  .sh { display: flex; align-items: center; gap: 7px; min-height: 22px; }
  .stag {
    flex: none;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Verdana, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
  }
  .stag.gold { background: #e8a020; }
  .stag.orange { background: #e8a020; }
  .stag.green { background: #0d8a64; }
  .stitle { font-size: 14px; font-weight: bold; color: var(--teal); line-height: 1.25; }
  .stitle em { font-style: normal; font-family: Verdana, sans-serif; }

  /* ---------- example rows ---------- */
  .row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    border: 0;
    border-top: 1px dashed #eaf1ef;
    background: none;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .row:first-of-type { border-top: 0; }
  .nchip {
    flex: none;
    width: 46px;
    height: 23px;
    padding: 0;
    border-radius: 7px;
    background: #fff8de;
    border: 1px solid #f2d27a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: Verdana, sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: #8a5b00;
  }
  .chain {
    display: flex;
    align-items: center;
    gap: 2px;
    font-family: Verdana, sans-serif;
    font-size: 12.5px;
    font-weight: bold;
    color: #2c4c53;
    white-space: nowrap;
  }
  .chain .op { color: #9fb0ad; font-weight: normal; padding: 0 1px; }
  .chain .sv { color: #b97908; }
  .chain .arrow { color: #c9b26a; padding: 0 3px; font-weight: normal; }
  .chain .d, .chain .sv, .root, .dval, .dres { transition: transform .15s ease; }
  .chain .d.lit, .chain .sv.lit, .root.lit, .dval.lit, .dres.lit { animation: lit .42s ease; }
  @keyframes lit {
    0% { transform: scale(1); }
    45% { transform: scale(1.35); color: #0d8a64; }
    100% { transform: scale(1); }
  }
  .root {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: #0d8a64;
    color: #fff;
    font-size: 12.5px;
  }

  /* ---------- rows for dividing by 3/9 ---------- */
  .drow {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 2px 0;
    border: 0;
    border-top: 1px dashed #eaf1ef;
    background: none;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .drow:first-of-type { border-top: 0; }
  .divi {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: Verdana, sans-serif;
    font-size: 12.5px;
    font-weight: bold;
    color: #0d8a64;
    white-space: nowrap;
  }
  .dres {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 22px;
    padding: 0 4px;
    border-radius: 6px;
    background: #effaf4;
    border: 1px solid #b9e7d4;
    color: #0d8a64;
    font-size: 12.5px;
  }
  .tick {
    flex: none;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #0d8a64;
    color: #fff;
    font-family: Verdana, sans-serif;
    font-size: 10px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .note {
    flex: none;
    margin-top: 4px;
    padding-left: 2px;
    font-size: 12px;
    line-height: 1.3;
    color: var(--muted);
  }
</style>
</head>
<body class="en">
<div class="sheet">

  <div class="ttl">Digit Sum</div>
  <div class="sub">DIGIT SUM</div>

  <div class="def">
    <span class="dot"></span>
    <span>The sum of all the digits of a number is its <b>digit sum</b>.</span>
  </div>

  <div class="sec">
    <div class="sh"><span class="stag gold">e.g.</span><span class="stitle">Finding the digit sum</span></div>
    <button class="row" type="button">
      <span class="nchip">457</span>
      <span class="chain"><span class="d">4</span><span class="op">+</span><span class="d">5</span><span class="op">+</span><span class="d">7</span><span class="op">=</span><span class="sv">16</span><span class="arrow">→</span><span class="d">1</span><span class="op">+</span><span class="d">6</span><span class="op">=</span><span class="root">7</span></span>
    </button>
    <button class="row" type="button">
      <span class="nchip">236</span>
      <span class="chain"><span class="d">2</span><span class="op">+</span><span class="d">3</span><span class="op">+</span><span class="d">6</span><span class="op">=</span><span class="sv">11</span><span class="arrow">→</span><span class="d">1</span><span class="op">+</span><span class="d">1</span><span class="op">=</span><span class="root">2</span></span>
    </button>
    <button class="row" type="button">
      <span class="nchip">729</span>
      <span class="chain"><span class="d">7</span><span class="op">+</span><span class="d">2</span><span class="op">+</span><span class="d">9</span><span class="op">=</span><span class="sv">18</span><span class="arrow">→</span><span class="d">1</span><span class="op">+</span><span class="d">8</span><span class="op">=</span><span class="root">9</span></span>
    </button>
    <div class="note">If the total has two digits, add those two digits as well.</div>
  </div>

  <div class="sec">
    <div class="sh"><span class="stag orange">3</span><span class="stitle">Digit sum <em>3</em>, <em>6</em> or <em>9</em> → divisible by <em>3</em></span></div>
    <button class="drow" type="button">
      <span class="nchip">12</span>
      <span class="chain"><span class="d">1</span><span class="op">+</span><span class="d">2</span><span class="op">=</span><span class="sv">3</span></span>
      <span class="divi">12 ÷ 3 = <span class="dres">4</span></span>
      <span class="tick">✓</span>
    </button>
    <button class="drow" type="button">
      <span class="nchip">15</span>
      <span class="chain"><span class="d">1</span><span class="op">+</span><span class="d">5</span><span class="op">=</span><span class="sv">6</span></span>
      <span class="divi">15 ÷ 3 = <span class="dres">5</span></span>
      <span class="tick">✓</span>
    </button>
    <button class="drow" type="button">
      <span class="nchip">18</span>
      <span class="chain"><span class="d">1</span><span class="op">+</span><span class="d">8</span><span class="op">=</span><span class="sv">9</span></span>
      <span class="divi">18 ÷ 3 = <span class="dres">6</span></span>
      <span class="tick">✓</span>
    </button>
  </div>

  <div class="sec">
    <div class="sh"><span class="stag green">9</span><span class="stitle">Digit sum <em>9</em> → divisible by <em>9</em></span></div>
    <button class="drow" type="button">
      <span class="nchip">18</span>
      <span class="chain"><span class="d">1</span><span class="op">+</span><span class="d">8</span><span class="op">=</span><span class="sv">9</span></span>
      <span class="divi">18 ÷ 9 = <span class="dres">2</span></span>
      <span class="tick">✓</span>
    </button>
    <button class="drow" type="button">
      <span class="nchip">45</span>
      <span class="chain"><span class="d">4</span><span class="op">+</span><span class="d">5</span><span class="op">=</span><span class="sv">9</span></span>
      <span class="divi">45 ÷ 9 = <span class="dres">5</span></span>
      <span class="tick">✓</span>
    </button>
    <button class="drow" type="button">
      <span class="nchip">108</span>
      <span class="chain"><span class="d">1</span><span class="op">+</span><span class="d">0</span><span class="op">+</span><span class="d">8</span><span class="op">=</span><span class="sv">9</span></span>
      <span class="divi">108 ÷ 9 = <span class="dres">12</span></span>
      <span class="tick">✓</span>
    </button>
  </div>

</div>

<script>
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('.row, .drow'));

  function play(row) {
    var seq = Array.prototype.slice.call(row.querySelectorAll('.d, .sv, .root, .dres'));
    seq.forEach(function (el) { el.classList.remove('lit'); });
    void row.offsetWidth;
    var run = row.dataset.run = (parseInt(row.dataset.run || '0', 10) + 1);
    seq.forEach(function (el, i) {
      setTimeout(function () {
        if (row.dataset.run !== String(run)) return;
        el.classList.add('lit');
      }, i * 150);
    });
  }

  rows.forEach(function (row) {
    row.addEventListener('click', function () { play(row); });
  });
})();
</script>
</body>
</html>
