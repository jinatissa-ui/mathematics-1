<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     53 · Tell the time — practice (0–9 keys + Check + score)
     ============================================================ */
  .ttl { flex: none; font-size: 25px; }
  .sub { flex: none; margin-top: 0; font-size: 14px; letter-spacing: 2px; }

  .head {
    flex: none;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .cnt {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-top: 4px;
    padding: 3px 9px 4px;
    border-radius: 999px;
    background: var(--mint);
    border: 1px solid var(--mint-line);
    font-size: 14px;
    line-height: 1;
    color: var(--muted);
    white-space: nowrap;
  }
  .cnt b {
    font-family: Verdana, Garamond, sans-serif;
    font-size: 15px;
    color: var(--teal);
  }
  .cnt i { font-style: normal; }

  /* ---------- clock ---------- */
  .clock {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 236px;
    margin-top: 4px;
  }
  .clock svg {
    width: 236px;
    height: 236px;
    filter: drop-shadow(0 7px 15px rgba(13, 109, 116, .18));
  }

  /* ---------- blanks ---------- */
  .fields {
    flex: none;
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    margin-top: 8px;
    padding: 6px 8px 8px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #dff0e9;
  }
  .fields.shake { animation: shake .34s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .fcol {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .flab {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 20px;
    font-size: 15px;
    line-height: 1;
    font-weight: bold;
    color: #3f6a70;
  }
  .mk {
    display: inline-block;
    width: 14px;
    font-size: 15px;
    line-height: 1;
    font-weight: bold;
  }
  .mk.ok { color: #0d8a64; }
  .mk.no { color: #d2416f; }

  .fbox {
    width: 58px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    border: 1.5px dashed #b9ddd2;
    background: #f7fdfa;
    font-family: Verdana, Garamond, sans-serif;
    font-size: 21px;
    font-weight: bold;
    color: var(--teal);
    letter-spacing: 1px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .fbox.empty { color: #c2d8d1; letter-spacing: 2px; }
  .fbox.on {
    border-style: solid;
    border-color: #0d6d74;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(13, 109, 116, .16);
  }
  .fbox.ok { border-style: solid; border-color: #17a879; }
  .fbox.no { border-style: solid; border-color: #e0457a; background: #fff7f9; }

  /* ---------- instructions ---------- */
  .ask {
    flex: none;
    margin-top: 6px;
    text-align: center;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink-soft);
  }

  /* ---------- 0–9 keys ---------- */
  .pad {
    flex: none;
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-top: 6px;
  }
  .key {
    width: 31px;
    height: 34px;
    border: 1px solid #cfe6de;
    border-radius: 8px;
    background: #fff;
    color: var(--teal);
    font-family: Verdana, Garamond, sans-serif;
    font-size: 16px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 0 #dceee7;
    transition: background .12s ease, transform .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .key:hover { background: #f1fbf6; }
  .key:active { transform: translateY(1px); background: #e7f7f0; }
  .key.del { color: #a45600; font-family: inherit; font-size: 17px; }

  /* ---------- buttons ---------- */
  .acts {
    flex: none;
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }
  .chk, .nxt {
    height: 44px;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: .2px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .chk {
    width: 158px;
    color: #fff;
    background: linear-gradient(140deg, #17b183, #0d8a64);
    box-shadow: 0 5px 12px rgba(13, 138, 100, .28);
  }
  .nxt {
    width: 118px;
    color: #fff;
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    box-shadow: 0 5px 12px rgba(13, 109, 116, .26);
  }
  .chk:active, .nxt:active { transform: translateY(1px) scale(.99); }
  .chk:disabled, .nxt:disabled {
    opacity: .42;
    cursor: default;
    box-shadow: none;
  }

  /* ---------- scorecard ---------- */
  .res {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 45, 45, .36);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .res.on { opacity: 1; pointer-events: auto; }

  .rcard {
    position: relative;
    width: 300px;
    padding: 15px 18px 17px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 16px 38px rgba(0, 0, 0, .34);
    text-align: center;
    overflow: hidden;
    transform: translateY(10px) scale(.97);
    transition: transform .2s ease;
  }
  .res.on .rcard { transform: none; }
  .rcard > * { position: relative; z-index: 1; }

  .rtop {
    font-size: 15px;
    line-height: 1.2;
    font-weight: bold;
    letter-spacing: .6px;
    color: var(--green);
  }
  .rpct {
    margin-top: 2px;
    font-family: Verdana, Garamond, sans-serif;
    font-size: 44px;
    line-height: 1.05;
    font-weight: bold;
    color: var(--teal);
  }
  .rscore {
    margin-top: 1px;
    font-size: 16px;
    line-height: 1.3;
    color: var(--ink-soft);
  }
  .face {
    width: 102px;
    height: 102px;
    margin: 6px auto 0;
  }
  .face svg { display: block; width: 100%; height: 100%; }
  .face .m-happy { display: none; }
  .rcard.perfect .face .m-happy { display: block; }
  .rcard.perfect .face .m-calm { display: none; }

  .praise {
    display: none;
    margin-top: 2px;
    font-size: 16px;
    font-weight: bold;
    color: #d2416f;
  }
  .rcard.perfect .praise { display: block; }
  .rcard.perfect .face { animation: bob .55s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-7px) scale(1.05); }
  }

  .confetti {
    position: absolute;
    inset: 0;
    z-index: 0 !important;
    opacity: 0;
    pointer-events: none;
  }
  .rcard.perfect .confetti { opacity: 1; }
  .confetti span {
    position: absolute;
    top: -16px;
    width: 7px;
    height: 11px;
    border-radius: 2px;
    animation: fall 1.5s linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(330px) rotate(340deg); }
  }

  .again {
    margin-top: 11px;
    width: 176px;
    height: 44px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 13px rgba(13, 109, 116, .3);
  }
  .again:active { transform: translateY(1px); }
</style>
</head>
<body class="en">
<div class="sheet">
  <div class="head">
    <div>
      <div class="ttl">Tell the Time</div>
      <div class="sub">TELL THE TIME</div>
    </div>
    <div class="cnt"><span>Question</span><b id="qn">1</b><i>/ 10</i></div>
  </div>

  <div class="clock">
    <svg id="clk" viewBox="0 0 300 300" role="img" aria-label="clock">
      <circle cx="150" cy="150" r="146" fill="#fffdf8" stroke="#0d6d74" stroke-width="6"></circle>
      <circle cx="150" cy="150" r="137" fill="none" stroke="#dcefe8" stroke-width="2"></circle>

      <g id="ticks"></g>
      <g id="nums"></g>

      <g id="hh">
        <line x1="150" y1="158" x2="150" y2="92" stroke="#2f4a51" stroke-width="8" stroke-linecap="round"></line>
      </g>
      <g id="mh">
        <line x1="150" y1="164" x2="150" y2="46" stroke="#0d6d74" stroke-width="5" stroke-linecap="round"></line>
      </g>
      <g id="sh">
        <line x1="150" y1="176" x2="150" y2="40" stroke="#e0454a" stroke-width="2" stroke-linecap="round"></line>
        <circle cx="150" cy="167" r="3.4" fill="#e0454a"></circle>
        <circle cx="150" cy="40" r="3.6" fill="#e0454a"></circle>
      </g>

      <circle cx="150" cy="150" r="7" fill="#0d6d74"></circle>
      <circle cx="150" cy="150" r="2.6" fill="#ffcf3f"></circle>
    </svg>
  </div>

  <div class="fields" id="fields">
    <div class="fcol">
      <div class="flab">Hour<span class="mk" id="mk0"></span></div>
      <div class="fbox empty" id="f0" data-i="0">——</div>
    </div>
    <div class="fcol">
      <div class="flab">Minutes<span class="mk" id="mk1"></span></div>
      <div class="fbox empty" id="f1" data-i="1">——</div>
    </div>
    <div class="fcol">
      <div class="flab">Seconds<span class="mk" id="mk2"></span></div>
      <div class="fbox empty" id="f2" data-i="2">——</div>
    </div>
  </div>

  <div class="ask">Fill the blanks with the 0–9 buttons below</div>

  <div class="pad" id="pad">
    <button class="key" type="button" data-k="0">0</button>
    <button class="key" type="button" data-k="1">1</button>
    <button class="key" type="button" data-k="2">2</button>
    <button class="key" type="button" data-k="3">3</button>
    <button class="key" type="button" data-k="4">4</button>
    <button class="key" type="button" data-k="5">5</button>
    <button class="key" type="button" data-k="6">6</button>
    <button class="key" type="button" data-k="7">7</button>
    <button class="key" type="button" data-k="8">8</button>
    <button class="key" type="button" data-k="9">9</button>
    <button class="key del" type="button" id="del" aria-label="erase">←</button>
  </div>

  <div class="acts">
    <button class="chk" type="button" id="chk">Check</button>
    <button class="nxt" type="button" id="nxt" disabled>Next</button>
  </div>

  <div class="res" id="res">
    <div class="rcard" id="rcard">
      <div class="confetti" id="confetti">
        <span style="left:6%; background:#e0457b; animation-delay:.05s;"></span>
        <span style="left:16%; background:#ffcf3f; animation-delay:.55s;"></span>
        <span style="left:26%; background:#0d8a64; animation-delay:.25s;"></span>
        <span style="left:36%; background:#9c6ce5; animation-delay:.8s;"></span>
        <span style="left:46%; background:#ff9250; animation-delay:.4s;"></span>
        <span style="left:56%; background:#0d6d74; animation-delay:.95s;"></span>
        <span style="left:66%; background:#e0457b; animation-delay:.2s;"></span>
        <span style="left:76%; background:#ffcf3f; animation-delay:.7s;"></span>
        <span style="left:86%; background:#0d8a64; animation-delay:.35s;"></span>
        <span style="left:93%; background:#9c6ce5; animation-delay:.9s;"></span>
      </div>
      <div class="rtop">Your score</div>
      <div class="rpct" id="rpct">0%</div>
      <div class="rscore" id="rscore">Score 0 / 10</div>
      <div class="face">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="43" fill="#ffe08a" stroke="#e2a92f" stroke-width="4"></circle>
          <circle cx="35" cy="42" r="5" fill="#2f4a51"></circle>
          <circle cx="65" cy="42" r="5" fill="#2f4a51"></circle>
          <circle cx="26" cy="55" r="7" fill="#ffb3c1" opacity=".7"></circle>
          <circle cx="74" cy="55" r="7" fill="#ffb3c1" opacity=".7"></circle>
          <path class="m-calm" d="M35 64 L65 64" fill="none" stroke="#2f4a51" stroke-width="5" stroke-linecap="round"></path>
          <path class="m-happy" d="M31 59 Q50 77 69 59" fill="none" stroke="#2f4a51" stroke-width="5" stroke-linecap="round"></path>
        </svg>
      </div>
      <div class="praise">All correct!</div>
      <button class="again" type="button" id="again">Again</button>
    </div>
  </div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var CX = 150, CY = 150;

  /* ---------- clock face ---------- */
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180;
    var hour = (i % 5 === 0);
    var r1 = hour ? 129 : 134;
    var r2 = 141;
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (CX + r1 * Math.sin(a)).toFixed(2));
    l.setAttribute('y1', (CY - r1 * Math.cos(a)).toFixed(2));
    l.setAttribute('x2', (CX + r2 * Math.sin(a)).toFixed(2));
    l.setAttribute('y2', (CY - r2 * Math.cos(a)).toFixed(2));
    l.setAttribute('stroke', hour ? '#5f848a' : '#a9c8c1');
    l.setAttribute('stroke-width', hour ? 3 : 1.2);
    l.setAttribute('stroke-linecap', 'round');
    ticks.appendChild(l);
  }

  var nums = document.getElementById('nums');
  for (var n = 1; n <= 12; n++) {
    var ang = n * 30 * Math.PI / 180;
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', (CX + 104 * Math.sin(ang)).toFixed(2));
    t.setAttribute('y', (CY - 104 * Math.cos(ang)).toFixed(2));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-family', 'Verdana, "Nirmala UI", sans-serif');
    t.setAttribute('font-size', '31');
    t.setAttribute('font-weight', 'bold');
    t.setAttribute('fill', '#2f4a51');
    t.textContent = n;
    nums.appendChild(t);
  }

  /* ---------- 10 questions ---------- */
  var Q = [
    { h: 3,  m: 25, s: 10 },
    { h: 7,  m: 40, s: 30 },
    { h: 9,  m: 5,  s: 45 },
    { h: 12, m: 15, s: 20 },
    { h: 1,  m: 50, s: 5 },
    { h: 6,  m: 10, s: 40 },
    { h: 11, m: 35, s: 15 },
    { h: 4,  m: 45, s: 55 },
    { h: 8,  m: 20, s: 25 },
    { h: 10, m: 55, s: 35 }
  ];

  var hh = document.getElementById('hh');
  var mh = document.getElementById('mh');
  var sh = document.getElementById('sh');
  var qn = document.getElementById('qn');
  var fields = document.getElementById('fields');
  var boxes = [document.getElementById('f0'), document.getElementById('f1'), document.getElementById('f2')];
  var marks = [document.getElementById('mk0'), document.getElementById('mk1'), document.getElementById('mk2')];
  var chk = document.getElementById('chk');
  var nxt = document.getElementById('nxt');
  var res = document.getElementById('res');
  var rcard = document.getElementById('rcard');
  var rpct = document.getElementById('rpct');
  var rscore = document.getElementById('rscore');
  var again = document.getElementById('again');

  var qi = 0;
  var score = 0;
  var vals = ['', '', ''];
  var active = 0;
  var locked = false;

  function pad2(v) { return v < 10 ? '0' + v : '' + v; }

  function drawClock(d) {
    hh.setAttribute('transform', 'rotate(' + ((d.h % 12) * 30 + d.m * 0.5 + d.s * (0.5 / 60)).toFixed(2) + ' ' + CX + ' ' + CY + ')');
    mh.setAttribute('transform', 'rotate(' + (d.m * 6 + d.s * 0.1).toFixed(2) + ' ' + CX + ' ' + CY + ')');
    sh.setAttribute('transform', 'rotate(' + (d.s * 6) + ' ' + CX + ' ' + CY + ')');
  }

  function paint() {
    for (var i = 0; i < 3; i++) {
      boxes[i].textContent = vals[i] || '——';
      boxes[i].classList.toggle('empty', !vals[i]);
      boxes[i].classList.toggle('on', !locked && i === active);
    }
  }

  function clearMarks() {
    for (var i = 0; i < 3; i++) {
      marks[i].textContent = '';
      marks[i].className = 'mk';
      boxes[i].classList.remove('ok', 'no');
    }
  }

  function loadQuestion(i) {
    qi = i;
    qn.textContent = String(i + 1);
    drawClock(Q[i]);
    vals = ['', '', ''];
    active = 0;
    locked = false;
    clearMarks();
    chk.disabled = false;
    nxt.disabled = true;
    paint();
  }

  function tap(d) {
    if (locked) return;
    var v = vals[active];
    if (v.length >= 2) v = '';
    if (v.length < 2) vals[active] = v + d;
    if (vals[active].length === 2 && active < 2) active++;
    paint();
  }

  function back() {
    if (locked) return;
    if (vals[active]) {
      vals[active] = vals[active].slice(0, -1);
    } else if (active > 0) {
      active--;
      vals[active] = vals[active].slice(0, -1);
    }
    paint();
  }

  function check() {
    if (locked) return;
    if (!vals[0] && !vals[1] && !vals[2]) {
      fields.classList.remove('shake');
      void fields.offsetWidth;
      fields.classList.add('shake');
      active = 0;
      paint();
      return;
    }
    locked = true;

    var d = Q[qi];
    var want = [d.h, d.m, d.s];
    var all = true;
    for (var i = 0; i < 3; i++) {
      var got = vals[i] === '' ? NaN : parseInt(vals[i], 10);
      var ok = (got === want[i]);
      all = all && ok;
      marks[i].textContent = ok ? '✓' : '✗';
      marks[i].className = 'mk ' + (ok ? 'ok' : 'no');
      boxes[i].classList.add(ok ? 'ok' : 'no');
    }
    paint();

    if (all) score++;
    chk.disabled = true;
    nxt.disabled = false;

    if (qi === Q.length - 1) {
      setTimeout(finish, 1500);
    }
  }

  function finish() {
    var pct = Math.round(score / Q.length * 100);
    rpct.textContent = pct + '%';
    rscore.textContent = 'Score ' + score + ' / ' + Q.length;
    rcard.classList.toggle('perfect', pct === 100);
    res.classList.add('on');
  }

  function restart() {
    res.classList.remove('on');
    rcard.classList.remove('perfect');
    score = 0;
    loadQuestion(0);
  }

  document.getElementById('pad').addEventListener('click', function (e) {
    var k = e.target.closest ? e.target.closest('.key') : null;
    if (!k) return;
    if (k.id === 'del') back();
    else tap(k.getAttribute('data-k'));
  });

  boxes.forEach(function (b) {
    b.addEventListener('click', function () {
      if (locked) return;
      active = parseInt(b.getAttribute('data-i'), 10);
      paint();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (res.classList.contains('on')) return;
    if (e.key >= '0' && e.key <= '9') { e.preventDefault(); tap(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); back(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (!chk.disabled) check(); }
  });

  chk.addEventListener('click', check);
  nxt.addEventListener('click', function () {
    if (locked === false) return;
    if (qi < Q.length - 1) loadQuestion(qi + 1);
    else finish();
  });
  again.addEventListener('click', restart);

  loadQuestion(0);
})();
</script>
</body>
</html>
