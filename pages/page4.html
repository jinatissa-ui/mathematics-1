<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* extra parts for this page — the exercise table */
  .ttl { font-size: 23px; }

  .box { margin-top: 8px; padding: 6px 10px 7px; }
  .box-t { font-size: 16px; margin-bottom: 1px; }
  .box li { font-size: 16px; line-height: 1.35; padding-left: 15px; }
  .box li::before { top: 7.5px; width: 6px; height: 6px; left: 1px; }

  .tbl-wrap {
    width: 376px;
    margin-top: 8px;
    border: 1.5px solid #cfe3e0;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  table.ex {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.ex th {
    background: #f2fbf7;
    color: #0d8a64;
    font-size: 15px;
    line-height: 1.2;
    font-weight: bold;
    padding: 3px 2px;
    border-bottom: 1.5px solid #cfe3e0;
  }
  table.ex th.h { color: #6a35b8; }
  table.ex th.t { color: #2a68c1; }
  table.ex th.o { color: #e2541f; }
  table.ex tr.sub2 th {
    background: #f8fdfb;
    color: #7d8f95;
    font-size: 13px;
    font-weight: normal;
    padding: 1px 1px 2px;
    border-bottom: 1.5px solid #d8e9e6;
  }
  table.ex td {
    border-bottom: 1px solid #e7f0ee;
    text-align: center;
    padding: 2px 1px;
    vertical-align: middle;
  }
  table.ex tr:last-child td { border-bottom: 0; }
  table.ex td.num {
    font-family: Verdana, sans-serif;
    font-size: 19px;
    font-weight: bold;
    color: #0d6d74;
    letter-spacing: .3px;
  }

  .blank {
    width: 46px;
    height: 29px;
    border: 1.5px solid #cfdde0;
    border-radius: 7px;
    background: #fffdf8;
    text-align: center;
    font-family: Verdana, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: #0d6d74;
    outline: none;
    transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
  }
  .blank:focus { border-color: #17b183; background: #f4fffa; }
  .blank.sel { border-color: #17b183; background: #f4fffa; box-shadow: 0 0 0 2px rgba(23, 177, 131, .2); }
  .blank.ok  { border-color: #17b183; background: #e9fbf2; color: #0d8a64; }
  .blank.bad { border-color: #e0454a; background: #ffecec; color: #d02b31; }

  /* digit keypad */
  .pad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .kbtn {
    height: 33px;
    border: 1.5px solid #cfe3e0;
    border-radius: 9px;
    background: linear-gradient(180deg, #ffffff, #f1faf7);
    color: #0d6d74;
    font-family: Verdana, sans-serif;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 0 #d7ebe6;
    transition: transform .08s ease, box-shadow .08s ease, background .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .kbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 #d7ebe6; }
  .kbtn.zero { grid-column: span 2; }
  .kbtn.del {
    background: linear-gradient(180deg, #fff3f5, #ffe3e9);
    border-color: #f3c3ce;
    color: #c23a62;
    box-shadow: 0 2px 0 #f3cdd7;
    font-size: 19px;
  }

  /* check / reset buttons */
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .check {
    flex: 1;
    height: 39px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(180deg, #17b183, #0c8760);
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #086a4a, 0 6px 12px rgba(12, 135, 96, .25);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .check:active { transform: translateY(2px); box-shadow: 0 1px 0 #086a4a; }
  .reset {
    width: 42px;
    height: 39px;
    border: 0;
    border-radius: 11px;
    background: #eef4f3;
    color: #5d7378;
    font-size: 20px;
    cursor: pointer;
  }

  .result {
    margin-top: 4px;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.3;
    color: #0d6d74;
    min-height: 21px;
  }
  .result .pct {
    display: inline-block;
    min-width: 60px;
    padding: 0 8px 1px;
    border-radius: 999px;
    background: #eef4f3;
    font-family: Verdana, sans-serif;
    font-size: 16px;
  }
  .result.good .pct { background: #e2f8ee; color: #0d8a64; }
  .result.mid  .pct { background: #fff3d6; color: #b07a10; }
  .result.low  .pct { background: #ffe8e8; color: #c22c33; }
</style>
</head>
<body class="en">
  <div class="sheet">
    <h5 class="ttl">Fill in the blanks.</h5>

    <div class="box">
      <div class="box-t">Let's remember</div>
      <ul>
        <li><b>Digit</b> — the digit in that place</li>
        <li><b>Value</b> — the digit's value (e.g. 4 → 400)</li>
      </ul>
    </div>

    <div class="tbl-wrap">
    <table class="ex">
      <colgroup>
        <col style="width:64px">
        <col span="6" style="width:52px">
      </colgroup>
      <thead>
        <tr>
          <th rowspan="2">Number</th>
          <th colspan="2" class="h">Hundreds</th>
          <th colspan="2" class="t">Tens</th>
          <th colspan="2" class="o">Ones</th>
        </tr>
        <tr class="sub2">
          <th>Digit</th><th>Value</th>
          <th>Digit</th><th>Value</th>
          <th>Digit</th><th>Value</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    </div>

    <div class="pad" id="pad">
      <button class="kbtn" type="button" data-k="1">1</button>
      <button class="kbtn" type="button" data-k="2">2</button>
      <button class="kbtn" type="button" data-k="3">3</button>
      <button class="kbtn" type="button" data-k="4">4</button>
      <button class="kbtn" type="button" data-k="5">5</button>
      <button class="kbtn" type="button" data-k="6">6</button>
      <button class="kbtn" type="button" data-k="7">7</button>
      <button class="kbtn" type="button" data-k="8">8</button>
      <button class="kbtn" type="button" data-k="9">9</button>
      <button class="kbtn zero" type="button" data-k="0">0</button>
      <button class="kbtn del" type="button" data-k="back" title="Erase" aria-label="Erase">⌫</button>
    </div>

    <div class="actions">
      <button class="check" id="checkBtn" type="button">Check answers</button>
      <button class="reset" id="resetBtn" type="button" title="Reset">↺</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    var NUMBERS = [472, 305, 648, 290, 831];
    var tbody = document.getElementById('rows');
    var resultEl = document.getElementById('result');
    var activeInput = null;
    var audioCtx = null;

    /* ---------- build the table ---------- */
    NUMBERS.forEach(function (n) {
      var tr = document.createElement('tr');
      var h = Math.floor(n / 100);
      var t = Math.floor(n / 10) % 10;
      var o = n % 10;
      var cells = [[h, h * 100], [t, t * 10], [o, o]];

      var td = document.createElement('td');
      td.className = 'num';
      td.textContent = n;
      tr.appendChild(td);

      cells.forEach(function (pair) {
        [pair[0], pair[1]].forEach(function (ans) {
          var c = document.createElement('td');
          var inp = document.createElement('input');
          inp.className = 'blank';
          inp.type = 'text';
          inp.inputMode = 'numeric';
          inp.maxLength = 3;
          inp.setAttribute('data-ans', ans);
          inp.addEventListener('focus', function () { setActive(this); });
          inp.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
            this.classList.remove('ok', 'bad');
            resultEl.textContent = '';
            resultEl.className = 'result';
          });
          inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') document.getElementById('checkBtn').click();
          });
          c.appendChild(inp);
          tr.appendChild(c);
        });
      });

      tbody.appendChild(tr);
    });

    /* ---------- selected cell ---------- */
    function setActive(inp) {
      if (activeInput && activeInput !== inp) activeInput.classList.remove('sel');
      activeInput = inp;
      if (inp) inp.classList.add('sel');
    }

    function firstEmpty() {
      var list = document.querySelectorAll('.blank');
      for (var i = 0; i < list.length; i++) {
        if (!list[i].value) return list[i];
      }
      return list[0];
    }

    /* ---------- number keys ---------- */
    document.getElementById('pad').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.kbtn') : null;
      if (!btn) return;
      if (!activeInput || !activeInput.classList.contains('blank')) setActive(firstEmpty());
      if (!activeInput) return;
      var k = btn.getAttribute('data-k');
      if (k === 'back') {
        activeInput.value = activeInput.value.slice(0, -1);
      } else {
        if (activeInput.value.length >= 3) return;
        activeInput.value += k;
      }
      activeInput.dispatchEvent(new Event('input', { bubbles: true }));
      pop(520, .07);
    });

    /* ---------- sound ---------- */
    function pop(freq, len) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(freq * 1.3, audioCtx.currentTime + .1);
        g.gain.setValueAtTime(.14, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + (len || .2));
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + (len || .22));
      } catch (e) {}
    }

    /* ---------- checking the answers ---------- */
    function check() {
      var inputs = document.querySelectorAll('.blank');
      var right = 0;
      for (var i = 0; i < inputs.length; i++) {
        var inp = inputs[i];
        var ans = inp.getAttribute('data-ans');
        var v = inp.value.trim();
        var ok = v !== '' && Number(v) === Number(ans);
        inp.classList.remove('ok', 'bad');
        inp.classList.add(ok ? 'ok' : 'bad');
        if (ok) right++;
      }
      var total = inputs.length;
      var pct = Math.round(right * 100 / total);
      resultEl.className = 'result ' + (pct === 100 ? 'good' : pct >= 60 ? 'mid' : 'low');
      resultEl.innerHTML = 'Score ' + right + '/' + total +
        ' <span class="pct">' + pct + '%</span>' +
        (pct === 100 ? ' — Excellent!' : '');
      pop(pct === 100 ? 880 : 520, pct === 100 ? .5 : .2);
    }

    function reset() {
      document.querySelectorAll('.blank').forEach(function (inp) {
        inp.value = '';
        inp.classList.remove('ok', 'bad');
      });
      resultEl.textContent = '';
      resultEl.className = 'result';
      setActive(firstEmpty());
      pop(420, .15);
    }

    document.getElementById('checkBtn').addEventListener('click', check);
    document.getElementById('resetBtn').addEventListener('click', reset);
  </script>
</body>
</html>
