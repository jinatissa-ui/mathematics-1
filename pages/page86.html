<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Factors</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     86 · Factors
     (3 facts about factors + 10×10 multiplication table + factor pair)
     ============================================================ */
  .ttl { flex: none; font-size: 25px; line-height: 1.1; white-space: nowrap; }
  .sub { flex: none; margin-top: 2px; font-size: 14px; letter-spacing: 2px; }

  /* ---------- facts about factors ---------- */
  .facts {
    flex: none;
    margin-top: 6px;
    padding: 8px 12px;
    border-radius: 14px;
    background: #fffdf4;
    border: 1px solid #f2e6bd;
    box-shadow: 0 5px 12px rgba(120, 100, 40, .06);
  }
  .frow {
    display: flex;
    align-items: baseline;
    gap: 7px;
    font-size: 14px;
    line-height: 1.3;
    color: var(--ink);
  }
  .frow + .frow { margin-top: 4px; }
  .fb {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    transform: translateY(-1px);
  }
  .frow b { color: var(--teal); font-family: Verdana, sans-serif; }

  /* ---------- 10×10 multiplication table ---------- */
  .tbl {
    flex: none;
    margin-top: 6px;
    padding: 5px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 5px 12px rgba(30, 80, 80, .07);
  }
  .tgrid {
    display: grid;
    grid-template-columns: 26px repeat(10, 1fr);
    gap: 2px;
  }
  .hcell {
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    background: #f2fbf7;
    font-family: Verdana, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #5c7378;
  }
  .corner { background: transparent; }
  .pcell {
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    background: #fbfffd;
    font-family: Verdana, sans-serif;
    font-size: 13px;
    font-weight: bold;
    color: #0d8a64;              /* table numbers in their own colour */
    cursor: pointer;
    user-select: none;
  }
  .pcell:hover { background: #eefaf4; }
  .pcell.sel {
    background: #fff4cf;
    box-shadow: inset 0 0 0 2px #f6c945;
    color: #8a5b00;
  }

  /* ---------- factor pair ---------- */
  .panel {
    flex: none;
    height: 36px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 12px;
    background: #f2fbf7;
    border: 1px solid #d5eee6;
    font-size: 14px;
    color: var(--muted);
    overflow: hidden;
  }
  .panel .big { font-family: Verdana, sans-serif; font-size: 19px; color: var(--teal); }
  .panel .fac {
    min-width: 30px;
    height: 26px;
    padding: 0 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: #fffdf4;
    border: 1.5px solid #ffe08a;
    font-family: Verdana, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: #8a5b00;
  }
  .panel .sym { font-family: Verdana, sans-serif; font-size: 15px; color: #9ab4af; }
  .panel .pcap { margin-left: 3px; font-size: 13px; color: var(--muted); }
  .panel.pop { animation: ppop .28s ease; }
  @keyframes ppop {
    0% { transform: scale(.96); opacity: .4; }
    100% { transform: none; opacity: 1; }
  }
</style>
</head>
<body class="en">
<div class="sheet">

  <div class="ttl">Factors</div>
  <div class="sub">FACTORS</div>

  <div class="facts">
    <div class="frow"><span class="fb"></span><span><b>0</b> is not a factor of any number.</span></div>
    <div class="frow"><span class="fb"></span><span><b>1</b> is a factor of every whole number.</span></div>
    <div class="frow"><span class="fb"></span><span>Every whole number is a factor of <b>itself</b>.</span></div>
  </div>

  <div class="tbl">
    <div class="tgrid" id="tgrid"></div>
  </div>

  <div class="panel" id="panel">Tap a number in the table — its two factors appear.</div>

</div>

<script>
(function () {
  var grid = document.getElementById('tgrid');
  var panel = document.getElementById('panel');

  /* table: rows 1–10, columns 1–10, products inside */
  function cell(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  grid.appendChild(cell('hcell corner'));
  for (var c = 1; c <= 10; c++) grid.appendChild(cell('hcell', c));

  var cells = [];
  for (var r = 1; r <= 10; r++) {
    grid.appendChild(cell('hcell', r));
    for (c = 1; c <= 10; c++) {
      var p = cell('pcell', r * c);
      p.dataset.n = r * c;
      p.dataset.r = r;              /* row number */
      p.dataset.c = c;              /* column number */
      grid.appendChild(p);
      cells.push(p);
    }
  }

  /* the factors are just the row and column numbers of the tapped cell */
  function show(n, a, b) {
    panel.innerHTML =
      '<b class="big">' + n + '</b>' +
      '<span class="sym">=</span>' +
      '<span class="fac">' + a + '</span>' +
      '<span class="sym">×</span>' +
      '<span class="fac">' + b + '</span>' +
      '<span class="pcap">· factors of ' + n + '</span>';
    panel.classList.remove('pop');
    void panel.offsetWidth;
    panel.classList.add('pop');
  }

  cells.forEach(function (p) {
    p.addEventListener('click', function () {
      for (var i = 0; i < cells.length; i++) cells[i].classList.remove('sel');
      p.classList.add('sel');
      var r2 = parseInt(p.dataset.r, 10);
      var c2 = parseInt(p.dataset.c, 10);
      show(r2 * c2, r2, c2);
    });
  });
})();
</script>
</body>
</html>
