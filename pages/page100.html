<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Prime and Composite Numbers</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     100 · Prime and Composite Numbers
     (1–50 grid · factors · two rows)
     ============================================================ */
  .ttl { flex: none; font-size: 24px; line-height: 1.1; white-space: nowrap; }
  .sub { flex: none; margin-top: 2px; font-size: 12px; letter-spacing: 1.6px; }

  /* ---------- 1–50 grid ---------- */
  .gcard {
    flex: none;
    margin-top: 6px;
    padding: 5px 8px 6px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 5px 12px rgba(30, 80, 80, .06);
  }
  .gh { display: flex; align-items: center; gap: 6px; height: 19px; }
  .gh .gb {
    flex: none;
    height: 19px;
    padding: 0 7px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    background: #0d6d74;
    color: #fff;
    font-size: 10.5px;
    font-weight: bold;
  }
  .gh .gt { font-size: 12px; color: #6f7f7c; }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px 3px;
    margin-top: 3px;
  }
  .tile {
    height: 27px;
    padding: 0;
    border-radius: 7px;
    border: 1px solid #e2ebe9;
    background: #fbfdfc;
    font-family: Verdana, sans-serif;
    font-size: 11.5px;
    font-weight: bold;
    color: #3f5c5f;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .tile:active { transform: scale(.94); }
  .tile:focus { outline: none; }
  .tile:focus-visible { outline: 2px solid #4b9be8; outline-offset: 1px; }
  .tile.p { background: #fff2cf; border-color: #f0cf82; color: #a8720a; }
  .tile.c { background: #e7f7ef; border-color: #b6e3cf; color: #0d6d74; }
  .tile.one { background: #f1f0f6; border-color: #ddd9ea; color: #7a6f9c; }
  .tile.sel { box-shadow: 0 0 0 2px #4b9be8, 0 0 0 4px rgba(75, 155, 232, .18); }

  /* ---------- factors bar ---------- */
  .fac {
    flex: none;
    margin-top: 6px;
    padding: 6px 10px;
    border-radius: 13px;
    background: #fffdf8;
    border: 1px solid #f2e6bd;
    box-shadow: 0 4px 10px rgba(120, 100, 40, .05);
    display: flex;
    align-items: center;
    gap: 8px;
    height: 52px;
    box-sizing: border-box;
  }
  .fac.sw { animation: facin .22s ease; }
  @keyframes facin {
    0% { opacity: .4; transform: translateY(2px); }
    100% { opacity: 1; transform: none; }
  }
  .fnum {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: Verdana, sans-serif;
    font-size: 19px;
    font-weight: bold;
    background: #fff2cf;
    border: 1px solid #f0cf82;
    color: #a8720a;
  }
  .fnum.c { background: #e7f7ef; border-color: #b6e3cf; color: #0d6d74; }
  .fnum.one { background: #f1f0f6; border-color: #ddd9ea; color: #7a6f9c; }
  .fmid { flex: 1; min-width: 0; }
  .flab { display: block; font-size: 11.5px; color: #8d7f5c; line-height: 1.2; }
  .flab b { font-family: Verdana, sans-serif; color: #8a5b00; }
  .fchips { display: flex; gap: 2px; margin-top: 2px; height: 20px; }
  .fchip {
    flex: none;
    min-width: 21px;
    height: 20px;
    padding: 0 3px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid #e6dcc0;
    font-family: Verdana, sans-serif;
    font-size: 10.5px;
    font-weight: bold;
    color: #6f6042;
  }
  .ftype {
    flex: none;
    width: 54px;
    height: 24px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: bold;
    background: #fff2cf;
    border: 1px solid #f0cf82;
    color: #8a5b00;
  }
  .ftype.c { background: #e7f7ef; border-color: #b6e3cf; color: #0d6d74; }
  .ftype.one { background: #f1f0f6; border-color: #ddd9ea; color: #6f6490; }

  /* ---------- two rows ---------- */
  .lcard {
    flex: none;
    margin-top: 5px;
    padding: 5px 8px 6px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 4px 10px rgba(30, 80, 80, .05);
  }
  .lcard.o { border-color: #f4e2bf; background: #fffdf8; }
  .lcard.e { border-color: #d5eee6; background: #fbfefc; }
  .lh { display: flex; align-items: center; gap: 6px; height: 18px; }
  .lh .hb {
    flex: none;
    height: 18px;
    padding: 0 7px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    color: #fff;
    font-size: 10.5px;
    font-weight: bold;
  }
  .lcard.o .lh .hb { background: #e8a020; }
  .lcard.e .lh .hb { background: #0d8a64; }
  .lh .lt { font-size: 11.5px; color: #6f7f7c; }
  .lh .lt b { font-family: Verdana, sans-serif; }
  .lh .cnt { margin-left: auto; font-family: Verdana, sans-serif; font-size: 10.5px; color: #9aa9a6; }
  .nums { display: flex; flex-wrap: wrap; gap: 3px 2px; margin-top: 4px; height: 20px; align-content: flex-start; }
  .lcard.e .nums { height: 43px; }
  .ph { font-size: 10.5px; line-height: 20px; color: #a9b6b3; font-style: italic; white-space: nowrap; }
  .nchip {
    width: 18px;
    height: 20px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: Verdana, sans-serif;
    font-size: 10.5px;
    font-weight: bold;
  }
  .lcard.o .nchip { background: #fff3d2; border: 1px solid #f0d795; color: #9a6a08; }
  .lcard.e .nchip { background: #e9f8f0; border: 1px solid #bfe8d4; color: #0d7a5e; }
  .nchip.on { box-shadow: 0 0 0 2px #4b9be8, 0 0 0 3px rgba(75, 155, 232, .16); }
  .nchip.new { animation: writein .32s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes writein {
    0% { opacity: 0; transform: scale(.35) translateY(4px); }
    100% { opacity: 1; transform: none; }
  }
  .ftype.off { visibility: hidden; }

  /* ---------- footer note ---------- */
  .foot {
    flex: none;
    margin-top: 6px;
    padding: 5px 10px;
    border-radius: 11px;
    background: #f2fbf7;
    border: 1px solid #d5eee6;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 11.5px;
    line-height: 1.4;
    color: #4f6462;
  }
  .foot .k {
    flex: none;
    margin-top: 1px;
    height: 17px;
    padding: 0 6px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    background: #0d8a64;
    color: #fff;
    font-size: 9.5px;
    font-weight: bold;
  }
  .foot b { font-family: Verdana, sans-serif; }
  .foot.pop { animation: footpop .55s ease; }
  @keyframes footpop {
    0%, 100% { box-shadow: none; }
    40% { box-shadow: 0 0 0 3px rgba(13, 138, 100, .25); }
  }
</style>
</head>
<body class="en">
<div class="sheet">

  <div class="ttl">Prime and Composite Numbers</div>
  <div class="sub">PRIME &amp; COMPOSITE NUMBERS</div>

  <div class="gcard">
    <div class="gh">
      <span class="gb">1 – 50</span>
      <span class="gt">Tap a number to see its factors</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="fac" id="fac">
    <span class="fnum one" id="fnum">?</span>
    <span class="fmid">
      <span class="flab" id="flab">Tap a number</span>
      <span class="fchips" id="fchips"></span>
    </span>
    <span class="ftype one off" id="ftype"></span>
  </div>

  <div class="lcard o">
    <div class="lh">
      <span class="hb">Prime</span>
      <span class="lt">only <b>2</b> factors</span>
      <span class="cnt" id="pcnt">0</span>
    </div>
    <div class="nums" id="pc"><span class="ph">Numbers you tap are written here…</span></div>
  </div>

  <div class="lcard e">
    <div class="lh">
      <span class="hb">Composite</span>
      <span class="lt">more than <b>2</b> factors</span>
      <span class="cnt" id="ccnt">0</span>
    </div>
    <div class="nums" id="cc"><span class="ph">Numbers you tap are written here…</span></div>
  </div>

  <div class="foot">
    <span class="k">Note</span>
    <span><b>1</b> has only <b>1</b> factor.<br>It is neither prime nor composite.</span>
  </div>

</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var fnum = document.getElementById('fnum');
  var flab = document.getElementById('flab');
  var fchips = document.getElementById('fchips');
  var ftype = document.getElementById('ftype');
  var fac = document.getElementById('fac');
  var pc = document.getElementById('pc');
  var cc = document.getElementById('cc');
  var pcnt = document.getElementById('pcnt');
  var ccnt = document.getElementById('ccnt');
  var foot = document.querySelector('.foot');
  var writtenP = {}, writtenC = {};

  function factors(n) {
    var a = [];
    for (var i = 1; i <= n; i++) if (n % i === 0) a.push(i);
    return a;
  }
  function typeOf(f) { return f.length === 1 ? 'one' : (f.length === 2 ? 'p' : 'c'); }

  var tiles = [];
  for (var n = 1; n <= 50; n++) {
    var t = document.createElement('button');
    t.type = 'button';
    t.className = 'tile';
    t.textContent = n;
    t.dataset.n = n;
    t.addEventListener('click', select);
    grid.appendChild(t);
    tiles.push(t);
  }

  function select(e) {
    var n = parseInt(this.dataset.n, 10);
    var f = factors(n), kind = typeOf(f);
    var label = kind === 'p' ? 'Prime' : (kind === 'c' ? 'Composite' : 'Special');

    fnum.textContent = n;
    fnum.className = 'fnum ' + kind;
    flab.innerHTML = '<b>' + f.length + '</b> factors';

    fchips.innerHTML = '';
    f.forEach(function (d) {
      var s = document.createElement('span');
      s.className = 'fchip';
      s.textContent = d;
      fchips.appendChild(s);
    });

    ftype.textContent = label;
    ftype.className = 'ftype ' + kind;

    if (n === 1) {
      foot.classList.remove('pop');
      void foot.offsetWidth;
      foot.classList.add('pop');
    } else {
      var store = kind === 'p' ? writtenP : writtenC;
      if (!store[n]) {
        store[n] = 1;
        var box = kind === 'p' ? pc : cc;
        var ph = box.querySelector('.ph');
        if (ph) box.removeChild(ph);
        var c = document.createElement('span');
        c.className = 'nchip new';
        c.dataset.n = n;
        c.textContent = n;
        box.appendChild(c);
        setTimeout(function () { c.classList.remove('new'); }, 380);
        pcnt.textContent = Object.keys(writtenP).length + '';
        ccnt.textContent = Object.keys(writtenC).length + '';
      }
    }

    tiles.forEach(function (t) {
      var k = parseInt(t.dataset.n, 10);
      if (k === n) t.classList.add('sel', kind);
      else t.classList.remove('sel');
    });

    Array.prototype.forEach.call(document.querySelectorAll('.nchip'), function (c) {
      c.classList.toggle('on', parseInt(c.dataset.n, 10) === n);
    });

    fac.classList.remove('sw');
    void fac.offsetWidth;
    fac.classList.add('sw');
  }
})();
</script>
</body>
</html>
