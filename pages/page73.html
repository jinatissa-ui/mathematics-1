<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Subtracting Time · Practice</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     73 · Subtracting time — practice
     (hours·minutes / minutes·seconds / days·hours — random, borrowing 60/24)
     ============================================================ */
  .ttl { flex: none; font-size: 24px; line-height: 1.1; }
  .sub { flex: none; margin-top: 1px; font-size: 14px; letter-spacing: 2px; }

  /* ---------- score strip ---------- */
  .strip {
    flex: none;
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
  }
  .cell {
    height: 32px;
    border-radius: 8px;
    background: #fff;
    border: 1.5px solid #dfeee9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Verdana, "Iskoola Pota", "Nirmala UI", sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: #a7bab6;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  .cell.cur {
    border-color: #f0c14b;
    background: #fffbf0;
    box-shadow: 0 0 0 2px #ffe9a8;
    color: #b98a1a;
  }
  .cell.ok { background: #e9fbf3; border-color: #bfe8d8; color: #0d8a64; }
  .cell.no { background: #fdeef4; border-color: #f6c9da; color: #d2416f; }
  .cell.set { font-size: 18px; }

  /* ---------- problem card ---------- */
  .qcard {
    position: relative;
    flex: none;
    margin-top: 6px;
    height: 256px;
    padding: 8px 12px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid #e2efe9;
    box-shadow: 0 7px 16px rgba(30, 80, 80, .07);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 22px 1fr 1fr 10px 64px 24px;
    align-items: center;
    overflow: hidden;
  }
  .uh {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: .5px;
    color: #6f908d;
    text-align: center;
  }
  .u1 { grid-column: 1; grid-row: 1; }
  .u2 { grid-column: 2; grid-row: 1; }

  .d {
    font-family: Verdana, Garamond, sans-serif;
    font-size: 52px;
    line-height: 1;
    font-weight: bold;
    color: #22343b;
    text-align: center;
    letter-spacing: -1px;
    z-index: 2;
  }
  .minus { font-size: 26px; color: #c9869c; margin-right: 4px; vertical-align: 6px; }
  .r1c1 { grid-column: 1; grid-row: 2; }
  .r1c2 { grid-column: 2; grid-row: 2; }
  .r2c1 { grid-column: 1; grid-row: 3; }
  .r2c2 { grid-column: 2; grid-row: 3; }

  .dash {
    grid-column: 1 / 3;
    grid-row: 4;
    border-top: 2px dashed #b9cbc7;
    margin: 0 8px;
  }

  /* answer blanks */
  .ansbox {
    grid-row: 5;
    justify-self: center;
    width: 100px;
    height: 56px;
    padding: 0;
    border: 2px solid #d5e6e1;
    border-radius: 12px;
    background: #fbfefd;
    font-family: Verdana, Garamond, sans-serif;
    font-size: 40px;
    line-height: 1;
    font-weight: bold;
    color: #22343b;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .ansbox .blank { color: #c4d4d0; }
  .ansbox.on {
    border-color: #f0c14b;
    background: #fffbf0;
    box-shadow: 0 0 0 3px #ffe9a8;
  }
  .ansbox:disabled { cursor: default; }
  .ib1 { grid-column: 1; }
  .ib2 { grid-column: 2; }
  .qcard.right .ansbox {
    border-color: #9fdcc4;
    background: #f2fbf7;
    color: var(--green);
    box-shadow: none;
  }
  .qcard.wrong .ansbox {
    border-color: #f3bfd3;
    background: #fdf1f6;
    color: #d2416f;
    box-shadow: none;
  }

  .fb {
    grid-column: 1 / 3;
    grid-row: 6;
    text-align: center;
    font-size: 14.5px;
    line-height: 1.2;
    color: #8ba49f;
    white-space: nowrap;
  }
  .fb b { color: #d2870f; }
  .qcard.right .fb { font-size: 16px; font-weight: bold; color: var(--green); }
  .qcard.wrong .fb { color: #c0386a; }

  .pop { animation: pop .34s ease; }
  @keyframes pop {
    0% { transform: scale(.7); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ---------- digit pad ---------- */
  .pad {
    flex: none;
    margin-top: 6px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }
  .k {
    height: 38px;
    padding: 0;
    border: 1.5px solid #d5e6e1;
    border-radius: 9px;
    background: #fff;
    color: #22343b;
    font-family: Verdana, Garamond, sans-serif;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s ease, transform .12s ease, opacity .15s ease;
  }
  .k:active { background: #e9f7f2; transform: translateY(1px); }
  .k:disabled { opacity: .35; cursor: default; }

  /* ---------- buttons ---------- */
  .acts { flex: none; margin-top: 8px; display: flex; gap: 8px; }
  .b {
    height: 46px;
    border: 0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .b:active { transform: translateY(1px); }
  .bk {
    flex: 0 0 52px;
    background: #eef6f4;
    color: #4a7a78;
    border: 1.5px solid #cfe4df;
    font-size: 20px;
  }
  .ck {
    flex: 1 1 0;
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    color: #fff;
    box-shadow: 0 5px 12px rgba(13, 109, 116, .3);
  }
  .ck:disabled {
    background: #e3ebe9;
    color: #9fb0ad;
    box-shadow: none;
    cursor: default;
  }
  .bO {
    flex: 0 0 100px;
    background: #eef6f4;
    color: var(--teal);
    border: 1.5px solid #cfe4df;
  }

  /* ---------- score card ---------- */
  .res {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 45, 45, .36);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .res.on { opacity: 1; pointer-events: auto; }
  .rcard {
    position: relative;
    width: 280px;
    padding: 15px 18px 17px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 16px 38px rgba(0, 0, 0, .34);
    text-align: center;
    overflow: hidden;
    transform: translateY(10px) scale(.97);
    transition: transform .2s ease;
  }
  .res.on .rcard { transform: none; }
  .rcard > * { position: relative; z-index: 1; }
  .rtop { font-size: 15px; font-weight: bold; letter-spacing: .6px; color: var(--green); }
  .rpct {
    margin-top: 2px;
    font-family: Verdana, Garamond, sans-serif;
    font-size: 42px;
    line-height: 1.05;
    font-weight: bold;
    color: var(--teal);
  }
  .rscore { margin-top: 1px; font-size: 15.5px; color: var(--ink-soft); }
  .clap { width: 116px; height: 96px; margin: 8px auto 0; display: none; }
  .perfect .clap { display: block; }
  .clap svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .clap .hl { animation: clL .4s ease-in-out infinite alternate; transform-origin: 38px 66px; }
  .clap .hr { animation: clR .4s ease-in-out infinite alternate; transform-origin: 82px 66px; }
  @keyframes clL {
    from { transform: translateX(0) rotate(0deg); }
    to   { transform: translateX(9px) rotate(5deg); }
  }
  @keyframes clR {
    from { transform: translateX(0) rotate(0deg); }
    to   { transform: translateX(-9px) rotate(-5deg); }
  }
  .clap .arc { animation: aflash .4s ease-in-out infinite alternate; }
  @keyframes aflash { from { opacity: 0; } to { opacity: 1; } }
  .praise { margin-top: 3px; font-size: 16px; font-weight: bold; color: #d2416f; display: none; }
  .perfect .praise { display: block; }
  .rmsg { margin-top: 10px; font-size: 16px; font-weight: bold; color: var(--teal); }
  .perfect .rmsg { display: none; }
  .confetti { position: absolute; inset: 0; z-index: 0 !important; pointer-events: none; display: none; }
  .perfect .confetti { display: block; }
  .confetti span {
    position: absolute;
    top: -16px;
    width: 7px;
    height: 11px;
    border-radius: 2px;
    animation: fall 1.5s linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(320px) rotate(340deg); }
  }
  .rbtn {
    margin-top: 11px;
    width: 160px;
    height: 42px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body class="en">
<div class="sheet">
  <div class="ttl">Subtracting Time Practice</div>
  <div class="sub">PRACTICE</div>

  <div class="strip" id="strip"></div>

  <div class="qcard" id="qcard">
    <div class="uh u1" id="u1">Hours</div>
    <div class="uh u2" id="u2">Minutes</div>

    <div class="d r1c1" id="a1">4</div>
    <div class="d r1c2" id="a2">11</div>
    <div class="d r2c1" id="b1"><span class="minus">−</span>1</div>
    <div class="d r2c2" id="b2">44</div>

    <div class="dash"></div>

    <button class="ansbox ib1" type="button" id="ib1"><span class="blank" id="i1">–</span></button>
    <button class="ansbox ib2 on" type="button" id="ib2"><span class="blank" id="i2">–</span></button>

    <div class="fb" id="fb">Write the digits from the right.</div>
  </div>

  <div class="pad" id="pad">
    <button class="k" type="button" data-d="1">1</button>
    <button class="k" type="button" data-d="2">2</button>
    <button class="k" type="button" data-d="3">3</button>
    <button class="k" type="button" data-d="4">4</button>
    <button class="k" type="button" data-d="5">5</button>
    <button class="k" type="button" data-d="6">6</button>
    <button class="k" type="button" data-d="7">7</button>
    <button class="k" type="button" data-d="8">8</button>
    <button class="k" type="button" data-d="9">9</button>
    <button class="k" type="button" data-d="0">0</button>
  </div>

  <div class="acts">
    <button class="b bk" type="button" id="bk">⌫</button>
    <button class="b ck" type="button" id="ck" disabled>Check</button>
    <button class="b bO" type="button" id="bO">Another</button>
  </div>

  <div class="res" id="res">
    <div class="rcard" id="rcard">
      <div class="confetti">
        <span style="left:6%; background:#e0457b; animation-delay:.05s;"></span>
        <span style="left:16%; background:#ffcf3f; animation-delay:.55s;"></span>
        <span style="left:26%; background:#0d8a64; animation-delay:.25s;"></span>
        <span style="left:36%; background:#9c6ce5; animation-delay:.8s;"></span>
        <span style="left:46%; background:#ff9250; animation-delay:.4s;"></span>
        <span style="left:56%; background:#0d6d74; animation-delay:.95s;"></span>
        <span style="left:66%; background:#e0457b; animation-delay:.2s;"></span>
        <span style="left:76%; background:#ffcf3f; animation-delay:.7s;"></span>
        <span style="left:86%; background:#0d8a64; animation-delay:.35s;"></span>
        <span style="left:93%; background:#9c6ce5; animation-delay:.9s;"></span>
      </div>
      <div class="rtop">Your score</div>
      <div class="rpct" id="rpct">100%</div>
      <div class="rscore" id="rscore">Score 10 / 10</div>
      <div class="clap">
        <svg viewBox="0 0 120 100" aria-hidden="true">
          <g class="arc" stroke="#de8f0f" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M52 18 Q60 10 68 18"></path>
            <path d="M46 26 Q60 12 74 26" opacity=".55"></path>
          </g>
          <g class="hl">
            <rect x="14" y="26" width="30" height="48" rx="14" fill="#ffcf3f" stroke="#e2a92f" stroke-width="3"></rect>
            <line x1="24" y1="30" x2="24" y2="46" stroke="#e2a92f" stroke-width="2.4" stroke-linecap="round"></line>
            <line x1="31" y1="29" x2="31" y2="46" stroke="#e2a92f" stroke-width="2.4" stroke-linecap="round"></line>
            <line x1="38" y1="30" x2="38" y2="46" stroke="#e2a92f" stroke-width="2.4" stroke-linecap="round"></line>
            <ellipse cx="16" cy="58" rx="7" ry="10" fill="#ffcf3f" stroke="#e2a92f" stroke-width="3" transform="rotate(18 16 58)"></ellipse>
          </g>
          <g class="hr">
            <rect x="76" y="26" width="30" height="48" rx="14" fill="#ffcf3f" stroke="#e2a92f" stroke-width="3"></rect>
            <line x1="82" y1="30" x2="82" y2="46" stroke="#e2a92f" stroke-width="2.4" stroke-linecap="round"></line>
            <line x1="89" y1="29" x2="89" y2="46" stroke="#e2a92f" stroke-width="2.4" stroke-linecap="round"></line>
            <line x1="96" y1="30" x2="96" y2="46" stroke="#e2a92f" stroke-width="2.4" stroke-linecap="round"></line>
            <ellipse cx="104" cy="58" rx="7" ry="10" fill="#ffcf3f" stroke="#e2a92f" stroke-width="3" transform="rotate(-18 104 58)"></ellipse>
          </g>
        </svg>
      </div>
      <div class="praise">All correct! Let’s clap!</div>
      <div class="rmsg" id="rmsg">Let’s practise a little more!</div>
      <button class="rbtn" type="button" id="rbtn">Again</button>
    </div>
  </div>
</div>

<script>
(function () {
  var TOTAL = 10;
  var PAIRS = [
    { up: 'Hours', low: 'Minutes', base: 60 },
    { up: 'Minutes', low: 'Seconds', base: 60 },
    { up: 'Days', low: 'Hours', base: 24 }
  ];

  var strip = document.getElementById('strip');
  var u1 = document.getElementById('u1'), u2 = document.getElementById('u2');
  var a1 = document.getElementById('a1'), a2 = document.getElementById('a2');
  var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  var qcard = document.getElementById('qcard');
  var ib = [document.getElementById('ib1'), document.getElementById('ib2')];
  var isp = [document.getElementById('i1'), document.getElementById('i2')];
  var fb = document.getElementById('fb');
  var keys = Array.prototype.slice.call(document.querySelectorAll('.k'));
  var bk = document.getElementById('bk');
  var ck = document.getElementById('ck');
  var bO = document.getElementById('bO');
  var res = document.getElementById('res'), rcard = document.getElementById('rcard');
  var rpct = document.getElementById('rpct'), rscore = document.getElementById('rscore');
  var rmsg = document.getElementById('rmsg'), rbtn = document.getElementById('rbtn');

  var cells = [];
  for (var i = 0; i < TOTAL; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    c.textContent = i + 1;
    strip.appendChild(c);
    cells.push(c);
  }

  var phase = 0, P = null, marks = [], locked = false, done = false;
  var vals = ['', ''], active = 0;
  var bag = [], last = -1;

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function nextPhase() {
    if (!bag.length) {
      bag = [0, 1, 2];
      for (var i = bag.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      if (bag[bag.length - 1] === last) {
        var s = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = s;
      }
    }
    last = bag.pop();
    return last;
  }

  function makeProblem(ph) {
    var U = PAIRS[ph], base = U.base;
    var hi1 = ph === 2 ? rnd(5, 9) : rnd(4, 9);
    var hi2 = rnd(1, Math.min(2, hi1 - 3));
    var rem, lo1, lo2;
    if (base === 24) {
      rem = rnd(6, 16);
      lo1 = rnd(4, Math.max(4, Math.min(12, rem - 5)));
      lo2 = lo1 + 24 - rem;
    } else {
      rem = rnd(14, 45);
      lo1 = rnd(6, Math.max(8, Math.min(40, rem - 6)));
      lo2 = lo1 + 60 - rem;
    }
    return {
      hi1: hi1, hi2: hi2, lo1: lo1, lo2: lo2,
      sum: lo1 + base, rem: rem,
      ansHi: hi1 - 1 - hi2
    };
  }

  function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  function updateCur() {
    for (var i = 0; i < TOTAL; i++) cells[i].classList.remove('cur');
    if (!done && marks.length < TOTAL) cells[marks.length].classList.add('cur');
  }

  function setActive(i) {
    active = i;
    ib[0].classList.toggle('on', i === 0);
    ib[1].classList.toggle('on', i === 1);
  }

  function paint() {
    for (var i = 0; i < 2; i++) {
      if (vals[i] === '') {
        isp[i].textContent = '–';
        isp[i].className = 'blank';
      } else {
        isp[i].textContent = vals[i];
        isp[i].className = '';
      }
    }
    ck.disabled = locked || vals[0] === '' || vals[1] === '';
  }

  function render() {
    var U = PAIRS[phase];
    u1.textContent = U.up;
    u2.textContent = U.low;
    a1.textContent = P.hi1; a2.textContent = P.lo1;
    b1.innerHTML = '<span class="minus">−</span>' + P.hi2;
    b2.textContent = P.lo2;

    vals = ['', ''];
    locked = false;
    qcard.className = 'qcard';
    setActive(1);
    paint();

    fb.className = 'fb';
    fb.textContent = 'Write the digits from the right.';
    keys.forEach(function (k) { k.disabled = false; });
    bk.disabled = false;
    updateCur();
  }

  function typeDigit(d) {
    if (locked) return;
    var v = vals[active];
    if (v.length >= 2) return;
    if (v === '0') v = '';
    vals[active] = v + d;
    paint();
    if (active === 1) {
      var need = String(P.rem).length;
      if (vals[1].length >= need) setActive(0);
    }
  }

  function backspace() {
    if (locked) return;
    vals[active] = vals[active].slice(0, -1);
    paint();
  }

  function check() {
    if (locked || vals[0] === '' || vals[1] === '') return;
    locked = true;

    var ok = (+vals[0] === P.ansHi && +vals[1] === P.rem);
    marks.push(ok);

    var c = cells[marks.length - 1];
    c.className = 'cell set ' + (ok ? 'ok' : 'no');
    c.textContent = ok ? '✓' : '✗';

    qcard.classList.add(ok ? 'right' : 'wrong');
    var U = PAIRS[phase];
    if (ok) {
      fb.textContent = 'Correct! ✓';
      pop(ib[0]); pop(ib[1]);
    } else {
      fb.innerHTML = 'Correct answer: <b>' + U.up + ' ' + P.ansHi +
        ' · ' + U.low + ' ' + P.rem + '</b>';
    }

    keys.forEach(function (k) { k.disabled = true; });
    bk.disabled = true;
    ck.disabled = true;

    if (marks.length === TOTAL) {
      done = true;
      updateCur();
      setTimeout(showResult, 1400);
    } else {
      updateCur();
    }
  }

  function showResult() {
    var right = 0;
    for (var i = 0; i < marks.length; i++) if (marks[i]) right++;
    var pct = Math.round(right * 100 / TOTAL);
    rpct.textContent = pct + '%';
    rscore.textContent = 'Score ' + right + ' / ' + TOTAL;

    if (right === TOTAL) {
      rcard.className = 'rcard perfect';
      applause();
    } else {
      rcard.className = 'rcard';
      rmsg.textContent = right >= 8 ? 'Good! Let us practise a little more.' : 'Let us practise again!';
    }
    res.classList.add('on');
  }

  function newProblem() {
    if (done) return;
    phase = nextPhase();
    P = makeProblem(phase);
    render();
  }

  function restart() {
    res.classList.remove('on');
    rcard.className = 'rcard';
    marks = [];
    done = false;
    locked = false;
    for (var i = 0; i < TOTAL; i++) {
      cells[i].className = 'cell';
      cells[i].textContent = i + 1;
    }
    newProblem();
  }

  /* ---------- applause ---------- */
  var AC = null;
  function ensureAudio() {
    if (!AC) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      try { AC = new Ctx(); } catch (e) { AC = null; return; }
    }
    if (AC.state === 'suspended') AC.resume();
  }
  document.addEventListener('pointerdown', ensureAudio);

  function clapAt(t) {
    var dur = 0.12;
    var n = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, n, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var k = 1 - i / n;
      d[i] = (Math.random() * 2 - 1) * k * k * k;
    }
    var src = AC.createBufferSource();
    src.buffer = buf;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1500;
    bp.Q.value = 0.8;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(AC.destination);
    src.start(t);
  }

  function applause() {
    ensureAudio();
    if (!AC) return;
    var t = AC.currentTime + 0.04;
    for (var r = 0; r < 3; r++) {
      for (var k = 0; k < 5; k++) clapAt(t + r * 0.24 + k * 0.03);
    }
  }

  keys.forEach(function (k) {
    k.addEventListener('click', function () { typeDigit(k.getAttribute('data-d')); });
  });
  ib[0].addEventListener('click', function () { if (!locked) setActive(0); });
  ib[1].addEventListener('click', function () { if (!locked) setActive(1); });
  bk.addEventListener('click', backspace);
  ck.addEventListener('click', check);
  bO.addEventListener('click', newProblem);
  rbtn.addEventListener('click', restart);

  phase = nextPhase();
  P = makeProblem(phase);
  render();
})();
</script>
</body>
</html>
