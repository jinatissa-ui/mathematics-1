<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Estimating Volume</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     80 · Estimating volume
     (water tank + tap + measuring cylinder + 0–9 buttons)
     ============================================================ */
  .ttl { flex: none; font-size: 25px; line-height: 1.1; white-space: nowrap; }
  .sub { flex: none; margin-top: 2px; font-size: 14px; letter-spacing: 2px; }

  /* ---------- instruction strip ---------- */
  .lead {
    flex: none;
    margin-top: 4px;
    font-size: 14px;
    line-height: 1.35;
    color: var(--muted);
  }

  /* ---------- main card ---------- */
  .pcard {
    position: relative;
    flex: none;
    margin-top: 6px;
    padding: 10px 12px 9px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 6px 14px rgba(30, 80, 80, .07);
  }

  .pcount {
    position: absolute;
    top: 8px;
    right: 10px;
    height: 22px;
    padding: 0 9px;
    display: flex;
    align-items: center;
    gap: 2px;
    border-radius: 999px;
    background: #f2fbf7;
    border: 1px solid #d5eee6;
    font-size: 14px;
    font-weight: bold;
    color: var(--teal);
  }
  .pcount b { font-family: Verdana, sans-serif; font-size: 14px; }

  .qlabel {
    margin-top: 3px;
    font-size: 15px;
    line-height: 1.25;
    font-weight: bold;
    color: var(--ink-soft);
  }

  .arow { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

  .abox {
    width: 86px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: #fffdf4;
    border: 2px solid #ffe08a;
    box-shadow: inset 0 2px 4px rgba(120, 100, 40, .06);
    font-family: Verdana, sans-serif;
    font-size: 24px;
    font-weight: bold;
    color: var(--teal);
    letter-spacing: 1px;
  }
  .abox.on { border-color: #0d8a64; background: #effaf4; }
  .abox.bad { border-color: #e0457b; background: #fff2f7; color: #c0305f; }
  .abox .car {
    display: inline-block;
    width: 2px;
    height: 25px;
    background: #c9d6d2;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .unit { font-size: 15px; font-weight: bold; color: var(--muted); }

  .del {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    margin-left: auto;
    border: 1px solid #dbe7e6;
    border-radius: 10px;
    background: #f7fbfa;
    cursor: pointer;
  }
  .del:active { background: #e9f4f1; }
  .del:disabled { opacity: .45; cursor: default; }

  /* ---------- message ---------- */
  .status {
    flex: none;
    height: 21px;
    margin-top: 6px;
    text-align: center;
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
  }
  .status.ok { color: #0d8a64; font-weight: bold; }
  .status.near { color: #b57a12; font-weight: bold; }
  .status.bad { color: #d2416f; }

  /* ---------- buttons ---------- */
  .btns { flex: none; margin-top: 5px; }
  .btn {
    height: 46px;
    border-radius: 12px;
    border: 0;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .next {
    width: 100%;
    background: #f2fbf7;
    border: 1px solid #c6e5da;
    color: var(--teal);
  }
  .next:active { background: #e6f7f0; }

  /* ---------- bottom area: buttons + tank/cylinder ---------- */
  .zone {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
    min-height: 0;
  }
  .pad {
    flex: none;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 180px;
  }
  .key {
    height: 40px;
    border-radius: 10px;
    border: 1px solid #dcebe7;
    background: linear-gradient(180deg, #ffffff, #f4fbf8);
    font-family: Verdana, sans-serif;
    font-size: 19px;
    font-weight: bold;
    color: #2c4c53;
    cursor: pointer;
    box-shadow: 0 2px 3px rgba(30, 70, 70, .06);
  }
  .key:active { transform: translateY(1px); background: #e9f7f1; }
  .key:disabled { opacity: .45; cursor: default; transform: none; }

  .lab { flex: none; position: relative; width: 206px; height: 240px; }
  .lab svg { display: block; }

  /* ---------- liquid levels ---------- */
  .tliq, .cliq { transform-box: fill-box; transform-origin: bottom; }

  /* ---------- tap ---------- */
  #tap { cursor: default; }
  #tap.live { cursor: pointer; animation: nudge 1.5s ease 2; }
  #tap.live .pill { filter: drop-shadow(0 0 6px rgba(232, 160, 32, .95)); }
  @keyframes nudge {
    0%, 100% { transform: none; }
    50% { transform: translateY(2px); }
  }

  /* ---------- water stream ---------- */
  .stream { opacity: 0; transition: opacity .15s; }
  .stream.on { opacity: 1; animation: flow .5s linear infinite; }
  @keyframes flow { 50% { opacity: .55; } }

  /* ---------- right/near animation ---------- */
  .fx {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 60;
  }
  .fx.on { opacity: 1; }
  .fx .fb {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px 8px 8px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .18), 0 0 0 3px #bfe7d8;
    transform: scale(.7);
    transition: transform .28s cubic-bezier(.2, 1.4, .4, 1);
  }
  .fx.on .fb { transform: scale(1); }
  .fx .fc {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #0d8a64;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
  }
  .fx .ftext { font-size: 17px; font-weight: bold; color: #0d8a64; }
  .fx.near .fb { box-shadow: 0 10px 24px rgba(0, 0, 0, .18), 0 0 0 3px #f4d79a; }
  .fx.near .fc { background: #e8a020; }
  .fx.near .ftext { color: #b57a12; }

  .cft {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    z-index: 1;
  }

  .abox.shake { animation: shake .32s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
</style>
</head>
<body class="en">
<div class="sheet">

  <div class="ttl">Estimating Volume</div>
  <div class="sub">ESTIMATING VOLUME</div>

  <div class="lead">Tap the tap, then estimate and write the volume of liquid you get.</div>

  <div class="pcard" id="card">
    <div class="pcount">Volume <b id="pno">1</b>/5</div>

    <div class="qlabel">Write the estimated volume</div>
    <div class="arow">
      <div class="abox" id="abox"><span class="car"></span></div>
      <span class="unit">millilitres</span>
      <button class="del" id="del" type="button" aria-label="Erase">
        <svg viewBox="0 0 24 18" width="22" height="17" aria-hidden="true">
          <path d="M7 2h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7L1 9z" fill="none" stroke="#5c7378" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10 6l6 6M16 6l-6 6" stroke="#5c7378" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="fx" id="fx">
      <div class="fb" id="fb"><span class="fc">✓</span><span class="ftext" id="fxt">Excellent!</span></div>
    </div>
  </div>

  <div class="status" id="status">Write 3 digits.</div>

  <div class="btns">
    <button class="btn next" id="next" type="button">Another volume</button>
  </div>

  <div class="zone">
    <div class="pad" id="pad">
      <button class="key" type="button">1</button>
      <button class="key" type="button">2</button>
      <button class="key" type="button">3</button>
      <button class="key" type="button">4</button>
      <button class="key" type="button">5</button>
      <button class="key" type="button">6</button>
      <button class="key" type="button">7</button>
      <button class="key" type="button">8</button>
      <button class="key" type="button">9</button>
      <button class="key" type="button">0</button>
    </div>
    <div class="lab" id="lab"></div>
  </div>

</div>

<script>
(function () {
  var TANK_MAX = 550;   /* same scale for both glass vessels — equal liquid heights look equal */
  var CYL_MAX = 550;    /* measuring cylinder range: 0–550 */
  var VOLS = [135, 170, 205, 240, 275, 310, 350, 385, 420, 460];

  var $ = function (id) { return document.getElementById(id); };
  var box = $('abox'), statusEl = $('status'), counter = $('pno');
  var nextBtn = $('next'), keys = [].slice.call(document.querySelectorAll('.key'));
  var del = $('del'), fx = $('fx'), fxt = $('fxt');
  var lab = $('lab');
  var tap = null, tliq = null, cliq = null, stream = null;

  var vols = [], idx = 0, digits = '', checked = false, attempts = 0, score = 0;
  var finished = false, live = false, replaceNext = false;
  var pouring = false, resultTimer = null, clearTimer = null, gen = 0;

  function svgEl(n, at) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', n);
    for (var k in at) e.setAttribute(k, at[k]);
    return e;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildSet() {
    return shuffle(VOLS.slice()).slice(0, 5);
  }

  /* ---------- scene: two glass vessels + tap + measuring cylinder ---------- */
  /* both vessels share the same width, height and scale — water heights can be compared directly */
  function glassVessel(top, withMarks) {
    var g = svgEl('g', {});
    /* liquid — full width, light blue-purple */
    var liq = svgEl('rect', { x: 47, y: top + 7, width: 112, height: 80, fill: '#ccccff', 'class': withMarks ? 'cliq' : 'tliq' });
    g.appendChild(liq);
    /* glass shell — a simple rectangle */
    g.appendChild(svgEl('rect', {
      x: 47, y: top, width: 112, height: 88, fill: 'none', stroke: '#9aa7a9', 'stroke-width': 2
    }));
    if (withMarks) {
      /* measuring marks — along the left inner edge; values inside on the right */
      for (var v = 50; v <= CYL_MAX; v += 50) {
        var y = (top + 87) - v / CYL_MAX * 80;
        var major = v % 100 === 0;
        g.appendChild(svgEl('line', {
          x1: 49, y1: y.toFixed(1), x2: major ? 63 : 57, y2: y.toFixed(1),
          stroke: major ? '#8f9a9c' : '#aab6b8', 'stroke-width': 1
        }));
        if (major) {
          var t = svgEl('text', {
            x: 151, y: (y + 4).toFixed(1), 'text-anchor': 'end',
            'font-family': 'Verdana, sans-serif', 'font-size': 12,
            'font-weight': 'bold', fill: '#4b4b45'
          });
          t.textContent = v;
          g.appendChild(t);
        }
      }
      /* the 0 mark — at the bottom */
      var z = svgEl('text', {
        x: 151, y: (top + 85).toFixed(1), 'text-anchor': 'end',
        'font-family': 'Verdana, sans-serif', 'font-size': 12,
        'font-weight': 'bold', fill: '#4b4b45'
      });
      z.textContent = '0';
      g.appendChild(z);
      /* wide base */
      g.appendChild(svgEl('path', {
        d: 'M27,' + (top + 100) + ' L47,' + (top + 88) + ' Q103,' + (top + 93) + ' 159,' + (top + 88) +
           ' L179,' + (top + 100) + ' Q103,' + (top + 106) + ' 27,' + (top + 100) + ' Z',
        fill: '#e3e7e7', stroke: '#9aa7a9', 'stroke-width': 1.5
      }));
    }
    return g;
  }

  (function buildLab() {
    var svg = svgEl('svg', { width: 206, height: 240, viewBox: '0 0 206 240' });

    /* the upper vessel — no marks (this is the one to estimate) */
    svg.appendChild(glassVessel(4, false));
    tliq = svg.querySelector('.tliq');
    cliq = null;

    /* the tap — close to the cylinder */
    var tg = svgEl('g', { id: 'tap' });
    tg.appendChild(svgEl('rect', { x: 94, y: 92, width: 18, height: 8, fill: '#aab6b8' }));
    tg.appendChild(svgEl('rect', { x: 62, y: 102, width: 82, height: 22, rx: 11, fill: '#f6c945', stroke: '#d9a91f', 'stroke-width': 1.5, 'class': 'pill' }));
    var tt = svgEl('text', { x: 103, y: 117, 'text-anchor': 'middle', 'font-family': 'inherit', 'font-size': 13, 'font-weight': 'bold', fill: '#7a5d0e' });
    tt.textContent = 'Tap';
    tg.appendChild(tt);
    svg.appendChild(tg);
    tap = tg;

    /* water stream — shown only while pouring */
    stream = svgEl('rect', { x: 99, y: 126, width: 8, height: 10, rx: 2, fill: '#ccccff', 'class': 'stream' });
    svg.appendChild(stream);

    /* lower measuring cylinder — same as the upper vessel */
    svg.appendChild(glassVessel(138, true));
    cliq = svg.querySelector('.cliq');

    lab.appendChild(svg);
  })();

  /* ---------- setting the liquid levels ---------- */
  function resetLab(vol, animate) {
    stream.classList.remove('on');
    var tl = tliq, cl = cliq;
    if (animate) {
      cl.style.transition = 'transform .45s ease .1s';
      void cl.offsetWidth;
      cl.style.transform = 'scaleY(0)';
      tl.style.transition = 'transform .4s ease .2s';
      void tl.offsetWidth;
      tl.style.transform = 'scaleY(' + (vol / TANK_MAX) + ')';
    } else {
      cl.style.transition = 'none';
      cl.style.transform = 'scaleY(0)';
      tl.style.transition = 'none';
      tl.style.transform = 'scaleY(' + (vol / TANK_MAX) + ')';
    }
  }

  function cancelPour() {
    clearTimeout(resultTimer);
    resultTimer = null;
  }

  /* ---------- status ---------- */
  function setStatus(t, c) {
    statusEl.textContent = t;
    statusEl.className = 'status' + (c ? ' ' + c : '');
  }

  function renderBox() {
    if (digits) box.textContent = digits;
    else box.innerHTML = '<span class="car"></span>';
    box.classList.toggle('on', digits.length === 3);
  }

  /* ---------- right/near animation ---------- */
  function popBadge(text, exact) {
    fxt.textContent = text;
    fx.classList.toggle('near', !exact);
    fx.classList.remove('on');
    void fx.offsetWidth;
    fx.classList.add('on');

    var cols = ['#ffcf3f', '#7fd0c6', '#f7a1be', '#9c6ce5', '#4b9be8'];
    for (var i = 0; i < 12; i++) {
      var d = document.createElement('i');
      d.className = 'cft';
      d.style.background = cols[i % cols.length];
      fx.appendChild(d);
      var a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 60;
      d.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: 'translate(' + (Math.cos(a) * r).toFixed(1) + 'px,' + (Math.sin(a) * r).toFixed(1) + 'px) scale(.3)', opacity: 0 }
      ], { duration: 800 + Math.random() * 300, easing: 'cubic-bezier(.2,.7,.3,1)' });
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1250); })(d);
    }
    setTimeout(function () { fx.classList.remove('on'); }, 2200);
  }

  /* ---------- loading a volume ---------- */
  function loadVol() {
    gen++;
    digits = '';
    checked = false;
    attempts = 0;
    live = false;
    pouring = false;
    replaceNext = false;
    cancelPour();
    clearTimeout(clearTimer);

    counter.textContent = String(idx + 1);
    box.classList.remove('bad');
    renderBox();
    nextBtn.textContent = 'Another volume';
    nextBtn.disabled = false;

    for (var i = 0; i < keys.length; i++) keys[i].disabled = false;
    del.disabled = false;

    tap.classList.remove('live');
    resetLab(vols[idx], false);
    fx.classList.remove('on');
    setStatus('Write 3 digits.', '');
  }

  /* ---------- digits ---------- */
  function press(d) {
    if (finished || checked) return;
    clearTimeout(clearTimer);
    if (replaceNext) { digits = ''; replaceNext = false; }
    if (digits.length >= 3) return;
    digits += d;
    box.classList.remove('bad');
    renderBox();
    if (digits.length === 3) {
      live = true;
      tap.classList.add('live');
      setStatus('Now tap the tap.', '');
    } else {
      tap.classList.remove('live');
      setStatus(3 - digits.length === 1 ? 'Write one more digit.' : 'Write 2 more digits.', '');
    }
  }

  function erase() {
    if (finished || checked || !digits.length) return;
    var wasPouring = pouring;
    cancelPour();
    pouring = false;
    replaceNext = false;
    digits = digits.slice(0, -1);
    box.classList.remove('bad');
    renderBox();
    tap.classList.remove('live');
    live = false;
    if (wasPouring) resetLab(vols[idx], true);
    setStatus(digits.length ? 'Write one more digit.' : 'Write 3 digits.', '');
  }

  /* ---------- the tap: measuring ---------- */
  tap.addEventListener('click', function () {
    if (!live || finished || checked || pouring) return;
    pouring = true;
    gen++;
    clearTimeout(clearTimer);

    setStatus('Measuring…', '');
    stream.classList.add('on');

    var tl = tliq, cl = cliq;
    var act = vols[idx];
    tl.style.transition = 'transform .9s ease-in';
    void tl.offsetWidth; /* style flush — no rAF needed */
    tl.style.transform = 'scaleY(0)';
    cl.style.transition = 'transform 1.05s ease-out .12s';
    void cl.offsetWidth;
    cl.style.transform = 'scaleY(' + (act / CYL_MAX) + ')';

    var g = gen;
    resultTimer = setTimeout(function () {
      resultTimer = null;
      if (g !== gen) return;
      showResult(act);
    }, 1700);
  });

  /* ---------- result ---------- */
  function showResult(act) {
    if (finished || checked) return;
    pouring = false;
    stream.classList.remove('on');
    var val = parseInt(digits, 10);
    var diff = Math.abs(val - act);

    if (diff <= 2) {
      score++;
      checked = true;
      cancelPour();
      clearTimeout(clearTimer);
      for (var i = 0; i < keys.length; i++) keys[i].disabled = true;
      del.disabled = true;
      tap.classList.remove('live');
      live = false;
      if (diff === 0) {
        setStatus('Excellent! Exactly ' + act + ' millilitres.', 'ok');
        popBadge('Excellent!', true);
      } else if (diff === 1) {
        setStatus('Good! The real volume is ' + act + ' millilitres.', 'near');
        popBadge('Good!', false);
      } else {
        setStatus('Close! The real volume is ' + act + ' millilitres.', 'near');
        popBadge('Close!', false);
      }
      if (idx === 4) {
        setTimeout(function () { if (!finished && idx === 4 && checked) finish(); }, 1750);
      }
    } else {
      /* wrong — the exact volume is not revealed; keep the direction in mind and try again */
      attempts++;
      replaceNext = true;
      live = false;
      tap.classList.remove('live');
      box.classList.add('bad');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      var nearHint = diff <= 20 ? 'Close! ' : '';
      if (val < act) {
        setStatus(nearHint + 'That is more than it holds. Estimate again.', 'bad');
      } else {
        setStatus(nearHint + 'That is less than it holds. Estimate again.', 'bad');
      }
      /* empty the cylinder and refill the tank — the exact volume is not shown */
      resetLab(act, true);

      clearTimeout(clearTimer);
      clearTimer = setTimeout(function () {
        if (finished || checked || digits.length !== 3) return;
        digits = '';
        replaceNext = false;
        box.classList.remove('bad');
        renderBox();
      }, 1000);
    }
  }

  /* ---------- finish ---------- */
  function finish() {
    if (finished) return;
    finished = true;
    checked = true;
    live = false;
    pouring = false;
    cancelPour();
    clearTimeout(clearTimer);
    tap.classList.remove('live');
    resetLab(0, false);
    for (var i = 0; i < keys.length; i++) keys[i].disabled = true;
    del.disabled = true;
    setStatus('All 5 volumes measured · Score ' + score + ' / 5', 'ok');
    nextBtn.textContent = 'Again';
  }

  function nextVol() {
    if (finished) {
      vols = buildSet();
      idx = 0;
      score = 0;
      finished = false;
      loadVol();
      return;
    }
    if (idx >= 4) { finish(); return; }
    idx++;
    loadVol();
  }

  /* ---------- events ---------- */
  for (var k = 0; k < keys.length; k++) {
    (function (btn) {
      btn.addEventListener('click', function () { press(btn.textContent.trim()); });
    })(keys[k]);
  }
  del.addEventListener('click', erase);
  nextBtn.addEventListener('click', nextVol);

  vols = buildSet();
  loadVol();
})();
</script>
</body>
</html>
