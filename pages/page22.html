<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     22 · Practice Multiplication — column method
     ============================================================ */
  .ttl { font-size: 25px; text-align: left; }
  .sub {
    margin-top: 1px;
    font-size: 14px;
    line-height: 1.2;
    letter-spacing: 1px;
    text-align: left;
    text-transform: none;
  }

  /* ---------- board ---------- */
  .bwrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    position: relative;
    width: 376px;
    padding: 10px 10px 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, #ffffff, #fdfbf5);
    border: 1px solid #e6e0d2;
    box-shadow: 0 4px 12px rgba(60, 80, 80, .10), inset 0 0 0 3px #fffdf8;
  }
  .qno {
    position: absolute;
    top: 6px;
    left: 13px;
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-family: Verdana, sans-serif;
    line-height: 1;
  }
  .qno b { font-size: 18px; color: #dd8422; }
  .qno span { font-size: 14px; color: var(--muted); }

  .stack {
    position: relative;
    margin: 10px auto 0;
  }
  .rw {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .rw .d {
    flex: 0 0 auto;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Verdana, sans-serif;
    font-weight: bold;
    line-height: 1;
  }
  .rw.main .d { font-size: 34px; color: var(--ink); border-radius: 9px; }
  .rw.main .d.on {
    background: #fff3cc;
    box-shadow: inset 0 0 0 2px #ffcf3f;
  }
  .rw.part .d { font-size: 30px; color: var(--teal); }
  .rw.part.ansline .d { font-size: 34px; color: var(--teal); }
  .rw.part.ansline.ans .d { color: var(--green); }
  .rw.res .d { font-size: 34px; color: var(--green); }
  .rw.sc .d { font-size: 14px; }

  /* the product written above and the carried digit */
  .rw.scr2 .d { font-size: 25px; color: var(--teal); border-radius: 8px; }
  .rw.scr .d { font-size: 21px; color: #c06a2a; border-radius: 8px; }

  /* tighter layout for larger problems, e.g. 7 digits */
  .board.compact { padding: 8px 10px 10px; }
  .stack.compact { margin-top: 6px; }
  .stack.compact .rw.main .d { font-size: 31px; }
  .stack.compact .rw.part .d { font-size: 27px; }
  .stack.compact .rw.part.ansline .d { font-size: 31px; }
  .stack.compact .rw.res .d { font-size: 31px; }
  .stack.compact .rw.scr2 .d { font-size: 23px; }
  .stack.compact .rw.scr .d { font-size: 19px; }
  .stack.compact .sgn { font-size: 25px; }
  .rw .d.take { animation: takepulse .45s ease 2; }
  @keyframes takepulse {
    50% { transform: scale(1.16); color: #dd8422; }
  }

  .sgn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-family: Verdana, sans-serif;
    font-weight: bold;
    font-size: 28px;
    color: var(--ink);
  }

  .ln {
    border-top: 2.5px solid #33454c;
    height: 0;
    margin: 2px 0 3px auto;
  }
  .ln.ln2 { visibility: hidden; }
  .dbl {
    height: 7px;
    margin: 2px 0 0 auto;
    border-top: 2px solid #33454c;
    border-bottom: 2px solid #33454c;
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform .4s ease;
  }
  .dbl.on { transform: scaleX(1); }

  .chp {
    display: inline-block;
    font-size: 14px;
    font-weight: bold;
    line-height: 18px;
    padding: 0 3px;
    border-radius: 5px;
    background: #fff3df;
    border: 1px solid #f1d3a6;
    color: #bf6427;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .2s ease, transform .2s ease;
  }
  .chp.on { opacity: 1; transform: none; }
  .chp.blink { animation: nblink .6s ease 2; }
  @keyframes nblink {
    0%, 100% { opacity: 1; }
    50% { opacity: .12; }
  }

  .d.drop { animation: dropin .3s ease; }
  @keyframes dropin {
    0%   { opacity: 0; transform: translateY(-12px) scale(1.2); }
    100% { opacity: 1; transform: none; }
  }

  /* ---------- step strip ---------- */
  .step {
    width: 376px;
    height: 58px;
    margin: 6px auto 0;
    padding: 6px 12px 7px;
    border-radius: 11px;
    background: var(--mint);
    border: 1px solid var(--mint-line);
    overflow: hidden;
  }
  .slabel {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.2;
    color: var(--muted);
  }
  .sline2 {
    margin-top: 2px;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
  }
  .sline2 b { color: var(--green); }

  /* ---------- buttons ---------- */
  .btns {
    display: flex;
    gap: 9px;
    width: 376px;
    margin: 6px auto 0;
  }
  .startBtn, .newBtn {
    flex: 1;
    height: 42px;
    border-radius: 11px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .startBtn {
    border: 0;
    background: linear-gradient(140deg, #13a675, #0c7c5a);
    color: #fff;
    box-shadow: 0 4px 10px rgba(13, 128, 94, .28), inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  .startBtn:active { transform: scale(.99); }
  .startBtn:disabled { opacity: .72; cursor: default; }
  .newBtn {
    border: 1.5px solid #9fd6c4;
    background: #fff;
    color: var(--teal);
  }
  .newBtn:active { transform: scale(.99); }
</style>
</head>
<body class="en">
  <div class="sheet">
    <h2 class="ttl">Practice Multiplication</h2>
    <div class="sub">COLUMN MULTIPLICATION · STEP BY STEP</div>

    <div class="bwrap">
      <div class="board">
        <div class="qno" id="qno"><b>(1).</b><span>/ 10</span></div>
        <div class="stack" id="stack"></div>
      </div>
    </div>

    <div class="step">
      <div class="slabel" id="slabel">Problem 1</div>
      <div class="sline2" id="sline2">Tap Start</div>
    </div>

    <div class="btns">
      <button class="startBtn" id="startBtn">Start</button>
      <button class="newBtn" id="newBtn">Other</button>
    </div>
  </div>

<script>
  /* ============================================================
     10 problems — answers have been checked
     ============================================================ */
  var PROBLEMS = [
    /*  1 */ { a: 135,  b: 8   },   /* = 1 080 */
    /*  2 */ { a: 458,  b: 23  },   /* = 10 534 */
    /*  3 */ { a: 1256, b: 57  },   /* = 71 592 */
    /*  4 */ { a: 548,  b: 60  },   /* = 32 880 */
    /*  5 */ { a: 8567, b: 253 },   /* = 2 167 451 */
    /*  6 */ { a: 236,  b: 34  },   /* = 8 024 */
    /*  7 */ { a: 148,  b: 26  },   /* = 3 848 */
    /*  8 */ { a: 327,  b: 48  },   /* = 15 696 */
    /*  9 */ { a: 2405, b: 36  },   /* = 86 580 */
    /* 10 */ { a: 1732, b: 45  }    /* = 77 940 */
  ];
  var PLACES = ['ones place', 'tens place', 'hundreds place', 'thousands place',
                'ten-thousands place', 'hundred-thousands place', 'millions place'];
  var ROUNDS = ['First', 'Second', 'Third'];

  var stack = document.getElementById('stack');
  var qno = document.getElementById('qno');
  var slabel = document.getElementById('slabel');
  var sline2 = document.getElementById('sline2');
  var startBtn = document.getElementById('startBtn');
  var newBtn = document.getElementById('newBtn');

  var idx = 0, cur = null, timers = [], runId = 0, running = false, audioCtx = null;

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0'); }

  function pop(freq, vol) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.4, audioCtx.currentTime + .1);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + .22);
    } catch (e) {}
  }

  /* ---------- build the board ---------- */
  function mkRow(cls, h, w) {
    var r = document.createElement('div');
    r.className = 'rw ' + cls;
    r.style.height = h + 'px';
    r.style.width = w + 'px';
    stack.appendChild(r);
    return r;
  }

  function mkCells(row, C, w, chips) {
    var arr = [];
    for (var i = 0; i < C; i++) {
      var d = document.createElement('span');
      d.className = 'd';
      d.style.width = w + 'px';
      row.appendChild(d);
      if (chips) {
        var c = document.createElement('span');
        c.className = 'chp';
        d.appendChild(c);
        arr.push({ cell: d, chip: c });
      } else {
        arr.push(d);
      }
    }
    return arr;
  }

  function mkLine(w, cls) {
    var l = document.createElement('div');
    l.className = 'ln' + (cls ? ' ' + cls : '');
    l.style.width = w + 'px';
    stack.appendChild(l);
    return l;
  }

  function setNum(cells, n) {
    var s = String(n), start = cells.length - s.length;
    for (var i = 0; i < cells.length; i++) cells[i].textContent = '';
    for (var j = 0; j < s.length; j++) cells[start + j].textContent = s.charAt(j);
  }

  function clearCells(cells) {
    for (var i = 0; i < cells.length; i++) cells[i].textContent = '';
  }

  function buildBoard(p) {
    stack.innerHTML = '';
    var a = p.a, b = p.b, prod = a * b;
    var lenA = String(a).length, lenB = String(b).length, lenR = String(prod).length;
    var C = Math.max(lenA, lenB, lenR);
    var compact = C >= 7;
    var cellW = C >= 7 ? 44 : 46;
    var W = C * cellW;
    var hA = compact ? 36 : 40;

    /* starting from the ones digit of the multiplier */
    var bs = String(b), bd = [];
    for (var k = 0; k < lenB; k++) bd.push(+bs.charAt(lenB - 1 - k));

    /* the parts multiplied by each digit (each row shifted) */
    var partials = [], pd = [];
    for (var k2 = 0; k2 < lenB; k2++) {
      var pv = a * bd[k2] * Math.pow(10, k2);
      partials.push(pv);
      var arr = [];
      for (var c = 0; c < C; c++) arr.push('');
      var s = String(pv);
      for (var j = 0; j < s.length; j++) arr[C - s.length + j] = s.charAt(j);
      pd.push(arr);
    }

    cur = {
      a: a, b: b, prod: prod, C: C, cellW: cellW, W: W,
      lenA: lenA, lenB: lenB, lenR: lenR, bd: bd, partials: partials, pd: pd,
      rows: {}, cells: {}, chips: [], schips: [], dbl: null, line2: null
    };

    stack.style.width = W + 'px';
    stack.classList.toggle('compact', compact);
    stack.parentNode.classList.toggle('compact', compact);

    /* product written above (the carried digit below) */
    cur.rows.prod = mkRow('scr2', compact ? 26 : 30, W);
    cur.cells.prod = mkCells(cur.rows.prod, C, cellW, false);
    cur.rows.carry = mkRow('scr', compact ? 20 : 24, W);
    cur.cells.carry = mkCells(cur.rows.carry, C, cellW, false);

    /* the number being multiplied */
    cur.rows.a = mkRow('main', hA, W);
    cur.cells.a = mkCells(cur.rows.a, C, cellW, false);
    setNum(cur.cells.a, a);

    /* the multiplier */
    cur.rows.b = mkRow('main', hA, W);
    cur.cells.b = mkCells(cur.rows.b, C, cellW, false);
    setNum(cur.cells.b, b);
    var sgn = document.createElement('b');
    sgn.className = 'sgn';
    sgn.textContent = '\u00d7';
    sgn.style.left = Math.max(-4, (C - lenB) * cellW - 28) + 'px';
    cur.rows.b.appendChild(sgn);

    /* the line */
    mkLine(Math.max(lenA, lenB) * cellW + 10);

    /* the part rows */
    for (var k3 = 0; k3 < lenB; k3++) {
      var h = (lenB === 1) ? (compact ? 40 : 42) : (compact ? 30 : 32);
      var cls = (lenB === 1) ? 'part ansline' : 'part';
      var r = mkRow(cls, h, W);
      cur.cells['p' + k3] = mkCells(r, C, cellW, false);
      if (k3 === 0) cur.firstPartRow = r;
    }

    if (lenB > 1) {
      cur.line2 = mkLine(lenR * cellW + 10, 'ln2');
      cur.rows.sc = mkRow('sc', 18, W);
      cur.schips = mkCells(cur.rows.sc, C, cellW, true);
      cur.rows.res = mkRow('res', compact ? 38 : 42, W);
      cur.cells.res = mkCells(cur.rows.res, C, cellW, false);
    }

    var dbl = document.createElement('div');
    dbl.className = 'dbl';
    dbl.style.width = lenR * cellW + 10 + 'px';
    stack.appendChild(dbl);
    cur.dbl = dbl;

    qno.querySelector('b').textContent = '(' + (idx + 1) + ').';
  }

  /* ---------- clearing ---------- */
  function clearChips(list) {
    for (var i = 0; i < list.length; i++) {
      list[i].chip.classList.remove('on', 'blink');
      list[i].chip.textContent = '';
    }
  }

  function clearMarks() {
    clearScratch();
    if (cur.schips.length) clearChips(cur.schips);
    for (var j = 0; j < cur.cells.a.length; j++) cur.cells.a[j].classList.remove('on');
    for (var m = 0; m < cur.cells.b.length; m++) cur.cells.b[m].classList.remove('on');
    for (var k = 0; k < cur.lenB; k++) clearCells(cur.cells['p' + k]);
    if (cur.cells.res) clearCells(cur.cells.res);
    if (cur.line2) cur.line2.style.visibility = 'hidden';
    cur.dbl.classList.remove('on');
    cur.firstPartRow.classList.remove('ans');
  }

  function loadProblem(n) {
    runId++;
    timers.forEach(clearTimeout);
    timers = [];
    running = false;
    idx = ((n % PROBLEMS.length) + PROBLEMS.length) % PROBLEMS.length;
    buildBoard(PROBLEMS[idx]);
    slabel.textContent = 'Problem ' + (idx + 1);
    sline2.textContent = 'Tap Start';
    startBtn.disabled = false;
    startBtn.textContent = 'Start';
  }

  /* ---------- animation ---------- */
  function highlightB(k) {
    for (var i = 0; i < cur.cells.b.length; i++) cur.cells.b[i].classList.remove('on');
    cur.cells.b[cur.C - 1 - k].classList.add('on');
  }

  function highlightA(col) {
    for (var i = 0; i < cur.cells.a.length; i++) cur.cells.a[i].classList.remove('on');
    if (col >= 0) cur.cells.a[col].classList.add('on');
  }

  function showChip(list, i, txt, blink) {
    var o = list[i];
    if (!o) return;
    o.chip.textContent = txt;
    o.chip.classList.remove('on', 'blink');
    void o.chip.offsetWidth;
    o.chip.classList.add('on');
    if (blink) o.chip.classList.add('blink');
  }

  function hideChip(list, i) {
    var o = list[i];
    if (o) { o.chip.classList.remove('on', 'blink'); o.chip.textContent = ''; }
  }

  function put(cell, txt) {
    cell.textContent = txt;
    cell.classList.remove('drop');
    void cell.offsetWidth;
    cell.classList.add('drop');
  }

  /* write a number ending in column endCol on the right */
  function writeNum(cells, n, endCol) {
    var s = String(n), start = endCol - (s.length - 1);
    for (var q = 0; q < s.length; q++) put(cells[start + q], s.charAt(q));
  }

  /* clear the two rows written above */
  function clearScratch() {
    clearCells(cur.cells.prod);
    clearCells(cur.cells.carry);
    for (var i = 0; i < cur.cells.prod.length; i++) {
      cur.cells.prod[i].classList.remove('take');
      cur.cells.carry[i].classList.remove('take');
    }
  }

  function startAnim() {
    if (!cur || running) return;
    runId++;
    var my = runId;
    timers.forEach(clearTimeout);
    timers = [];
    running = true;
    clearMarks();

    startBtn.disabled = true;
    startBtn.textContent = 'Multiplying\u2026';
    sline2.textContent = '';

    function at(when, fn) {
      timers.push(setTimeout(function () { if (my === runId) fn(); }, when));
    }

    var a = cur.a, b = cur.b, C = cur.C, lenA = cur.lenA, lenB = cur.lenB;
    var STEP = 5200, t = 250;

    at(t, function () {
      highlightB(0);
      slabel.textContent = 'First round · multiply by the ones';
      sline2.innerHTML = fmt(a) + ' × ' + cur.bd[0] + ' · write the row below';
    });
    t += 1400;

    for (var k = 0; k < lenB; k++) {
      (function (k) {
        var d = cur.bd[k];

        if (k > 0) {
          at(t, function () {
            clearScratch();
            highlightB(k);
            highlightA(-1);
            slabel.textContent = ROUNDS[k] + ' round · multiply by the ' +
              (k === 1 ? 'tens' : 'hundreds');
            sline2.innerHTML = fmt(a) + ' × ' + d + ' · the answer moves ' +
              (k === 1 ? 'one column' : 'two columns') + ' to the left';
            for (var z = 0; z < k; z++) {
              put(cur.cells['p' + k][C - 1 - z], '0');
              pop(520 + z * 40, .06);
            }
          });
          t += 1800;
        }

        if (d === 0) {
          at(t, function () {
            clearScratch();
            slabel.textContent = 'Multiplying by zero';
            sline2.textContent = '0 × ' + a + ' = 0 · write one zero';
            highlightA(-1);
            put(cur.cells['p' + k][C - 1], '0');
            pop(560, .08);
          });
          t += 3200;
          return;
        }

        var carry = 0;
        for (var j = 0; j < lenA; j++) {
          (function (j, carry) {
            var col = C - 1 - j - k;   /* the column where the answer is written (shifted left in later rounds) */
            var scol = C - 1 - j;      /* the number written above sits over the original digit */
            var da = +String(a).charAt(lenA - 1 - j);
            var P = da * d;
            var pu = P % 10;
            var sum1 = pu + carry;
            var bump = Math.floor(sum1 / 10);
            var out = sum1 % 10;
            var nextCarry = Math.floor((P + carry) / 10);
            var last = (j === lenA - 1);

            /* write the product above */
            at(t, function () {
              highlightB(k);
              highlightA(C - 1 - j);
              slabel.textContent = (PLACES[j] || 'ones place') + ' · ' +
                da + ' × ' + d + ' = ' + P;
              sline2.textContent = 'write ' + P + ' above';
              pop(500 + j * 25, .07);
            });

            at(t + 1400, function () {
              writeNum(cur.cells.prod, P, scol);
              pop(680, .09);
            });

            /* highlight the digit sent to the answer */
            at(t + 2800, function () {
              var puCell = cur.cells.prod[scol];
              if (puCell) puCell.classList.add('take');
              if (carry > 0) {
                var cCell = cur.cells.carry[scol];
                if (cCell) cCell.classList.add('take');
              }
              if (last) {
                sline2.textContent = carry > 0
                  ? P + ' + ' + carry + ' = ' + (P + carry) + ' · send to the answer'
                  : 'send ' + P + ' to the answer';
              } else if (carry > 0 && bump > 0) {
                /* if the total reaches 10, show the whole number added */
                sline2.textContent = P + ' + ' + carry + ' = ' + (P + carry) + ' · ' +
                  'write ' + out +
                  (nextCarry > 0 ? ' · carry ' + nextCarry : '');
              } else if (carry > 0) {
                sline2.textContent = pu + ' + ' + carry + ' = ' + sum1 + ' · ' +
                  'write ' + out +
                  (nextCarry > 0 ? ' · carry ' + nextCarry : '');
              } else {
                sline2.textContent = 'send ' + out + ' to the answer' +
                  (nextCarry > 0 ? ' · carry ' + nextCarry : '');
              }
              pop(560 + j * 20, .06);
            });

            /* send it down and write the carried digit above */
            at(t + 3800, function () {
              clearScratch();
              var cells = cur.cells['p' + k];
              if (last) {
                writeNum(cells, P + carry, col);
              } else {
                put(cells[col], String(out));
                if (nextCarry > 0) put(cur.cells.carry[scol - 1], String(nextCarry));
              }
              pop(730, .08);
            });

            t += STEP;
          })(j, carry);

          carry = Math.floor((+String(a).charAt(lenA - 1 - j) * d + carry) / 10);
        }
      })(k);
    }

    /* ---------- adding the parts ---------- */
    if (lenB > 1) {
      at(t, function () {
        clearScratch();
        highlightA(-1);
        for (var i = 0; i < cur.cells.b.length; i++) cur.cells.b[i].classList.remove('on');
        cur.line2.style.visibility = 'visible';
        slabel.textContent = 'Now add the parts';
        sline2.textContent = 'Add the ' + lenB + ' rows and write the answer';
        pop(620, .08);
      });
      t += 1200;

      var sc = 0;
      for (var c = C - 1; c >= 0; c--) {
        (function (c, sc) {
          var parts = [];
          for (var k4 = 0; k4 < lenB; k4++) parts.push(+cur.pd[k4][c]);
          var total = sc;
          for (var q = 0; q < parts.length; q++) total += parts[q];
          var out = total % 10, cout = Math.floor(total / 10);
          var eq = parts.join(' + ') + (sc > 0 ? ' + ' + sc : '') + ' = ' + total;

          at(t, function () {
            slabel.textContent = 'Addition · ' + (PLACES[c] || 'ones place');
            sline2.textContent = eq + (cout > 0
              ? ' · write ' + out + ' · carry ' + cout
              : ' · write ' + out);
            pop(540 + c * 20, .06);
          });

          if (cout > 0 && c > 0) {
            at(t + 1500, function () {
              showChip(cur.schips, c - 1, String(cout), false);
            });
          }

          at(t + 900, function () {
            hideChip(cur.schips, c);
            put(cur.cells.res[c], String(out));
            pop(700, .07);
          });

          t += 2100;
        })(c, sc);

        sc = Math.floor((sc + cur.pd.reduce(function (s2, row) { return s2 + (+row[c] || 0); }, 0)) / 10);
      }
    }

    /* ---------- final ---------- */
    at(t + 150, function () {
      clearScratch();
      if (cur.schips.length) clearChips(cur.schips);
      highlightA(-1);
      for (var i = 0; i < cur.cells.b.length; i++) cur.cells.b[i].classList.remove('on');
      cur.dbl.classList.add('on');
      if (lenB === 1) cur.firstPartRow.classList.add('ans');
      slabel.textContent = 'Final · ' + fmt(a) + ' × ' + b;
      sline2.innerHTML = 'Answer: <b>' + fmt(cur.prod) + '</b>';
      pop(980, .14);
      running = false;
      startBtn.disabled = false;
      startBtn.textContent = 'View again';
    });
  }

  startBtn.addEventListener('click', startAnim);
  newBtn.addEventListener('click', function () {
    running = false;
    loadProblem(idx + 1);
  });

  loadProblem(0);
</script>
</body>
</html>
