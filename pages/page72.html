<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Subtracting Time · Column Method</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     72 · Subtracting time — column method
     (47 cannot be taken from 22 → borrow 1 hour and add 60 → 82 − 47 = 35
      hours 5 → 4, 4 − 2 = 2)
     ============================================================ */
  .ttl { flex: none; font-size: 24px; line-height: 1.1; }
  .sub { flex: none; margin-top: 1px; font-size: 14px; letter-spacing: 2px; }

  /* ---------- stack card ---------- */
  .tabs {
    flex: none;
    display: flex;
    gap: 6px;
    margin-top: 6px;
    height: 28px;
  }
  .ph {
    flex: 1 1 0;
    min-width: 0;
    padding: 0;
    border: 1px solid var(--mint-line);
    border-radius: 999px;
    background: var(--mint);
    color: #4a7a78;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .ph.on {
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 3px 9px rgba(13, 109, 116, .28);
  }

  /* ---------- column subtraction ---------- */
  .stackcard {
    position: relative;
    flex: none;
    margin-top: 6px;
    height: 288px;
    padding: 8px 12px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid #e2efe9;
    box-shadow: 0 7px 16px rgba(30, 80, 80, .07);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 22px 1fr 1fr 8px 1fr 1fr 8px 1.2fr;
    align-items: center;
    overflow: hidden;
  }
  .uh {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: .5px;
    color: #6f908d;
    text-align: center;
  }
  .u1 { grid-column: 1; grid-row: 1; }
  .u2 { grid-column: 2; grid-row: 1; }

  .d {
    font-family: Verdana, Garamond, sans-serif;
    font-size: 40px;
    line-height: 1;
    font-weight: bold;
    color: #22343b;
    text-align: center;
    letter-spacing: -1px;
    z-index: 2;
  }
  .minus { font-size: 24px; color: #c9869c; margin-right: 4px; vertical-align: 5px; }
  .d.pink { color: #e0457a; }
  .d.gold { color: #d2870f; }
  .d.teal { color: var(--teal); }
  .d.green { color: var(--green); }

  /* rows */
  .r1c1 { grid-column: 1; grid-row: 2; }
  .r1c2 { grid-column: 2; grid-row: 2; }
  .r2c1 { grid-column: 1; grid-row: 3; }
  .r2c2 { grid-column: 2; grid-row: 3; }
  .dash { grid-column: 1 / 3; border-top: 2px dashed #b9cbc7; margin: 0 8px; }
  .dash.a { grid-row: 4; }
  .dash.b { grid-row: 7; }

  /* new subtraction in the second step */
  .n1 { grid-column: 1; grid-row: 5; }
  .n2 { grid-column: 2; grid-row: 5; }
  .r3c1 { grid-column: 1; grid-row: 6; }
  .r3c2 { grid-column: 2; grid-row: 6; }

  .f1 { grid-column: 1; grid-row: 8; }
  .f2 { grid-column: 2; grid-row: 8; }

  .finband {
    grid-column: 1 / 3;
    grid-row: 8;
    height: 46px;
    border-radius: 10px;
    background: #f1fcf7;
    border: 1px solid #d8f0e7;
    opacity: 0;
    transition: opacity .32s ease;
  }
  .stackcard.done .finband { opacity: 1; }

  .ghost { opacity: .09; }
  .pop { animation: pop .34s ease; }
  @keyframes pop {
    0% { transform: scale(.7); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* the borrowed "60" box */
  .fly {
    position: absolute;
    z-index: 6;
    left: 0;
    top: 0;
    padding: 2px 9px 3px;
    border-radius: 999px;
    background: linear-gradient(140deg, #ffd75e, #f2b833);
    border: 1px solid #e0a520;
    box-shadow: 0 4px 10px rgba(210, 135, 15, .35);
    font-family: Verdana, Garamond, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: #6b4400;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }

  /* ---------- step explanation ---------- */
  .calc {
    flex: none;
    margin-top: 6px;
    height: 62px;
    text-align: center;
  }
  .l1 {
    font-family: Verdana, "Iskoola Pota", "Nirmala UI", sans-serif;
    font-size: 19px;
    line-height: 1.25;
    font-weight: bold;
    color: var(--teal);
    white-space: nowrap;
  }
  .l1.hot { color: #d2416f; }
  .l1.good { color: var(--green); }
  .l2 {
    margin-top: 3px;
    font-size: 14px;
    line-height: 1.25;
    color: var(--ink-soft);
  }
  .l2 b { color: #d2870f; }

  /* ---------- buttons ---------- */
  .acts { flex: none; margin-top: 4px; display: flex; gap: 10px; }
  .nx, .next {
    height: 44px;
    border: 0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .nx:active, .next:active { transform: translateY(1px); }
  .next {
    flex: 1;
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    color: #fff;
    box-shadow: 0 5px 12px rgba(13, 109, 116, .3);
  }
  .nx {
    flex: 0 0 110px;
    background: #eef6f4;
    color: var(--teal);
    border: 1.5px solid #cfe4df;
  }
  .next:disabled {
    background: #eef6f4;
    color: var(--teal);
    border: 1.5px solid #cfe4df;
    box-shadow: none;
    cursor: default;
  }
  .next:disabled:active { transform: none; }
</style>
</head>
<body class="en">
<div class="sheet">
  <div class="ttl">Subtracting Time</div>
  <div class="sub">SUBTRACTING TIME</div>

  <div class="tabs">
    <button class="ph on" type="button" data-p="0">Hours · Minutes</button>
    <button class="ph" type="button" data-p="1">Minutes · Seconds</button>
    <button class="ph" type="button" data-p="2">Days · Hours</button>
  </div>

  <div class="stackcard" id="stack">
    <div class="uh u1" id="u1">Hours</div>
    <div class="uh u2" id="u2">Minutes</div>

    <div class="d r1c1" id="a1">5</div>
    <div class="d r1c2" id="a2">22</div>
    <div class="d r2c1" id="b1"><span class="minus">−</span>2</div>
    <div class="d r2c2" id="b2">47</div>

    <div class="dash a"></div>

    <div class="d gold n1" id="n1">3</div>
    <div class="d pink n2" id="n2">71</div>
    <div class="d r3c1" id="c1"><span class="minus">−</span>1</div>
    <div class="d r3c2" id="c2">44</div>

    <div class="dash b"></div>

    <div class="finband"></div>
    <div class="d green f1" id="f1">2</div>
    <div class="d green f2" id="f2">27</div>

    <div class="fly" id="fly">60</div>
  </div>

  <div class="calc">
    <div class="l1" id="l1">Subtract the two columns separately.</div>
    <div class="l2" id="l2">If the lower column is bigger, take 1 from the upper column and add 60.</div>
  </div>

  <div class="acts">
    <button class="next" type="button" id="next">Show the step →</button>
    <button class="nx" type="button" id="nx">Another</button>
  </div>
</div>

<script>
(function () {
  var stack = document.getElementById('stack');
  var u1 = document.getElementById('u1'), u2 = document.getElementById('u2');
  var a1 = document.getElementById('a1'), a2 = document.getElementById('a2');
  var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  var n1 = document.getElementById('n1'), n2 = document.getElementById('n2');
  var c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
  var dshb = document.querySelector('.dash.b');
  var f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
  var fly = document.getElementById('fly');
  var l1 = document.getElementById('l1'), l2 = document.getElementById('l2');
  var next = document.getElementById('next'), nx = document.getElementById('nx');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.ph'));

  var PAIRS = [
    { up: 'Hours', low: 'Minutes', base: 60 },
    { up: 'Minutes', low: 'Seconds', base: 60 },
    { up: 'Days', low: 'Hours', base: 24 }
  ];

  var phase = 0, st = 0, P = null, token = 0, first = true;

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function makeProblem(ph) {
    if (first && ph === 0) {
      return { hi1: 4, hi2: 1, lo1: 11, lo2: 44, sum: 71, rem: 27 };
    }
    var base = PAIRS[ph].base;
    var hi1 = ph === 2 ? rnd(5, 9) : rnd(4, 9);
    var hi2 = rnd(1, Math.min(2, hi1 - 3));
    var rem, lo1, lo2;
    if (base === 24) {
      rem = rnd(6, 16);
      lo1 = rnd(4, Math.max(4, Math.min(12, rem - 5)));
      lo2 = lo1 + 24 - rem;
    } else {
      rem = rnd(14, 45);
      lo1 = rnd(6, Math.max(8, Math.min(40, rem - 6)));
      lo2 = lo1 + 60 - rem;
    }
    return { hi1: hi1, hi2: hi2, lo1: lo1, lo2: lo2, sum: lo1 + base, rem: rem };
  }

  function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  function show(el) {
    el.classList.remove('ghost');
    pop(el);
  }

  function setChip() {
    for (var i = 0; i < 3; i++) chips[i].classList.toggle('on', i === phase);
  }

  function render() {
    var U = PAIRS[phase];
    u1.textContent = U.up;
    u2.textContent = U.low;

    a1.textContent = P.hi1; a2.textContent = P.lo1;
    b1.innerHTML = '<span class="minus">−</span>' + P.hi2; b2.textContent = P.lo2;

    n1.textContent = P.hi1 - 1;
    n2.textContent = P.sum;
    c1.innerHTML = '<span class="minus">−</span>' + P.hi2;
    c2.textContent = P.lo2;
    f1.textContent = P.hi1 - 1 - P.hi2;
    f2.textContent = P.rem;

    [n1, n2, c1, c2, dshb, f1, f2].forEach(function (el) {
      el.classList.add('ghost');
      el.classList.remove('pop');
    });
    [a1, a2, b1, b2].forEach(function (el) { el.classList.remove('pop'); });
    stack.classList.remove('done');
    fly.style.opacity = '0';

    l1.className = 'l1';
    l1.textContent = 'Subtract the two columns separately.';
    l2.innerHTML = 'If the lower column is bigger, take 1 from the upper column and add ' +
      U.base + '.';
    next.textContent = 'Show the step →';
    next.disabled = false;

    setChip();
    st = 0;
  }

  function flyBorrow() {
    var cb = stack.getBoundingClientRect();
    var s = a1.getBoundingClientRect(), t = a2.getBoundingClientRect();
    var sx = s.left + s.width / 2 - cb.left, sy = s.top + s.height / 2 - cb.top;
    var dx = (t.left + t.width / 2) - (s.left + s.width / 2);
    var dy = (t.top + t.height / 2) - (s.top + s.height / 2);
    fly.style.left = sx + 'px';
    fly.style.top = (sy - 16) + 'px';
    fly.style.opacity = '1';
    fly.style.transition = 'none';
    fly.style.transform = 'translate(-50%, -50%)';
    void fly.offsetWidth;
    var anim = fly.animate([
      { transform: 'translate(-50%, -50%) scale(1)' },
      { transform: 'translate(calc(-50% + ' + (dx / 2) + 'px), calc(-50% + ' + (dy / 2 - 22) + 'px)) scale(1.18)' },
      { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1)' }
    ], { duration: 760, easing: 'ease-in-out' });
    anim.onfinish = function () { fly.style.opacity = '0'; };
  }

  function step() {
    var U = PAIRS[phase], my = token;

    if (st === 0) {
      st = 1;
      pop(b2);
      l1.className = 'l1 hot';
      l1.textContent = 'Cannot subtract ' + P.lo2 + ' from ' + P.lo1 + ' ' + U.low.toLowerCase() + '.';
      l2.innerHTML = 'Take 1 ' + U.up.toLowerCase() + ' and make it <b>' + U.base + '</b> ' + U.low.toLowerCase() + '.';
      next.textContent = 'Take 1 ' + U.up.toLowerCase() + ' →';
      return;
    }

    if (st === 1) {
      st = 2;
      flyBorrow();
      [n1, n2, c1, c2].forEach(show);
      dshb.classList.remove('ghost');
      l1.className = 'l1';
      l1.textContent = (P.hi1 - 1) + ' ' + P.sum + ' − ' + P.hi2 + ' ' + P.lo2;
      l2.innerHTML = 'Took 1 from ' + P.hi1 + ' — now ' + (P.hi1 - 1) +
        ' · added ' + U.base + ' to ' + P.lo1 + ' — now ' + P.sum + '.';
      next.textContent = 'Now subtract →';
      return;
    }

    if (st === 2) {
      st = 3;
      pop(n2); pop(c2);
      l1.className = 'l1';
      l1.textContent = P.sum + ' − ' + P.lo2 + ' = ' + P.rem;
      l2.innerHTML = 'Now the ' + U.up.toLowerCase() + ': ' + (P.hi1 - 1) + ' − ' + P.hi2 +
        ' = ' + (P.hi1 - 1 - P.hi2) + '.';
      next.textContent = 'Show the answer →';
      return;
    }

    if (st === 3) {
      st = 4;
      show(f1); show(f2);
      stack.classList.add('done');
      l1.className = 'l1 good';
      l1.textContent = 'Answer: ' + U.up + ' ' + (P.hi1 - 1 - P.hi2) +
        ' · ' + U.low + ' ' + P.rem;
      l2.innerHTML = (P.hi1 - 1) + ' − ' + P.hi2 + ' = ' + (P.hi1 - 1 - P.hi2) +
        ' · ' + P.sum + ' − ' + P.lo2 + ' = ' + P.rem;
      next.textContent = 'Answer found ✓';
      next.disabled = true;
      setTimeout(function () { if (my === token && st === 4) pop(f1); }, 300);
      return;
    }
  }

  function newProblem() {
    token++;
    first = false;
    P = makeProblem(phase);
    render();
  }

  next.addEventListener('click', step);
  nx.addEventListener('click', newProblem);

  chips.forEach(function (c, i) {
    c.addEventListener('click', function () {
      if (i === phase) return;
      token++;
      first = false;
      phase = i;
      P = makeProblem(phase);
      render();
    });
  });

  P = makeProblem(phase);
  render();
})();
</script>
</body>
</html>
