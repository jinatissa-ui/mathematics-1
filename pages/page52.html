<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     52 · Read the time — clock card with night/day + table
     ============================================================ */
  .ttl { flex: none; font-size: 24px; }
  .sub { flex: none; margin-top: 0; font-size: 14px; letter-spacing: 2px; }

  /* ---------- clock card (night / day) ---------- */
  .stage {
    position: relative;
    flex: none;
    height: 218px;
    margin-top: 4px;
    border-radius: 14px;
    overflow: hidden;
    background: #060d1a;
    box-shadow: inset 0 0 0 1px rgba(13, 109, 116, .22), 0 6px 16px rgba(20, 50, 60, .16);
  }
  .stars {
    position: absolute;
    inset: 0;
    opacity: 1;
    transition: opacity .55s ease;
  }
  .stars svg { display: block; width: 100%; height: 100%; }
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(160px 140px at 50% 44%, rgba(255, 241, 209, .95), rgba(255, 241, 209, 0) 72%);
    opacity: .12;
    transition: opacity .55s ease;
    pointer-events: none;
  }
  .horizon {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 58px;
    background: linear-gradient(180deg, rgba(255, 186, 110, 0) 0%, rgba(255, 176, 95, .5) 55%, rgba(255, 160, 72, .82) 100%);
    opacity: 0;
    transition: opacity .55s ease;
    pointer-events: none;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    transition: width .4s ease, height .4s ease, left .4s ease, top .4s ease, opacity .55s ease;
  }
  .orb.sun {
    background: radial-gradient(circle at 38% 34%, #fffdea 0%, #ffe08a 45%, #ffb84d 100%);
    box-shadow: 0 0 26px rgba(255, 197, 90, .75);
  }
  .orb.moon {
    background: radial-gradient(circle at 36% 32%, #ffffff 0%, #e6eefc 58%, #c3d2e8 100%);
    box-shadow: 0 0 20px rgba(205, 225, 255, .5);
  }

  .clock {
    position: absolute;
    left: 102px;
    top: 22px;
    width: 172px;
    height: 172px;
  }
  .clock svg {
    display: block;
    width: 172px;
    height: 172px;
    filter: drop-shadow(0 5px 14px rgba(0, 0, 0, .38));
  }

  /* ---------- how it is said ---------- */
  .say {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    margin-top: 6px;
    padding: 0 12px;
    border-radius: 11px;
    background: #fff;
    border: 1px solid #dff0e9;
    font-size: 16px;
    line-height: 1.35;
    color: var(--ink);
    text-align: center;
  }
  .say b { color: var(--teal); }

  /* ---------- table + digital card ---------- */
  .row2 {
    flex: none;
    display: flex;
    gap: 8px;
    height: 84px;
    margin-top: 6px;
  }
  .tblwrap {
    flex: 1;
    min-width: 0;
    border-radius: 11px;
    overflow: hidden;
    border: 1px solid #dff0e9;
    background: #fff;
  }
  .tbl {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    text-align: center;
  }
  .tbl th {
    height: 26px;
    font-size: 14px;
    font-weight: bold;
    color: var(--green);
    background: #eefaf5;
  }
  .tbl th + th, .tbl td + td { border-left: 1px dashed #d9ece5; }
  .tbl td {
    height: 56px;
    font-family: Verdana, Garamond, sans-serif;
    font-size: 25px;
    font-weight: bold;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
  }

  .dcard {
    flex: none;
    width: 148px;
    border-radius: 11px;
    background: linear-gradient(160deg, #22353b 0%, #101d21 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09), inset 0 -10px 18px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .dtime {
    font-family: Verdana, Garamond, sans-serif;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: .8px;
    color: #ffd76a;
    white-space: nowrap;
  }
  .dtag {
    font-size: 14px;
    line-height: 1.1;
    font-weight: bold;
    color: #9fe3d8;
    letter-spacing: .4px;
    white-space: nowrap;
  }

  /* ---------- button ---------- */
  .btnwrap {
    flex: none;
    display: flex;
    justify-content: center;
    margin-top: 12px;
  }
  .next {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 172px;
    height: 44px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(140deg, #12a08c, #0d6d74);
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: .3px;
    cursor: pointer;
    box-shadow: 0 5px 13px rgba(13, 109, 116, .3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .next:hover { box-shadow: 0 8px 18px rgba(13, 109, 116, .38); }
  .next:active { transform: translateY(1px) scale(.99); }
  .next svg { width: 19px; height: 19px; flex: none; }
</style>
</head>
<body class="en">
<div class="sheet">
  <div class="ttl">Read the Time</div>
  <div class="sub">READ THE TIME</div>

  <!-- clock card that shows night/day -->
  <div class="stage" id="stage">
    <div class="stars" id="stars">
      <svg viewBox="0 0 376 218" aria-hidden="true" fill="#ffffff">
        <circle cx="20" cy="14" r="1.3" opacity=".9"></circle>
        <circle cx="48" cy="6" r="1" opacity=".7"></circle>
        <circle cx="72" cy="24" r="1.1" opacity=".8"></circle>
        <circle cx="96" cy="8" r="1.2" opacity=".85"></circle>
        <circle cx="140" cy="6" r="1" opacity=".7"></circle>
        <circle cx="190" cy="10" r="1.4" opacity=".9"></circle>
        <circle cx="236" cy="5" r="1" opacity=".7"></circle>
        <circle cx="286" cy="10" r="1.2" opacity=".85"></circle>
        <circle cx="318" cy="18" r="1" opacity=".75"></circle>
        <circle cx="350" cy="8" r="1.3" opacity=".9"></circle>
        <circle cx="30" cy="42" r="1" opacity=".75"></circle>
        <circle cx="66" cy="54" r="1.2" opacity=".8"></circle>
        <circle cx="92" cy="36" r="1" opacity=".7"></circle>
        <circle cx="300" cy="46" r="1.2" opacity=".8"></circle>
        <circle cx="330" cy="60" r="1" opacity=".7"></circle>
        <circle cx="356" cy="40" r="1" opacity=".75"></circle>
        <circle cx="16" cy="74" r="1.1" opacity=".8"></circle>
        <circle cx="360" cy="80" r="1.2" opacity=".8"></circle>
        <circle cx="26" cy="106" r="1" opacity=".7"></circle>
        <circle cx="352" cy="110" r="1.1" opacity=".8"></circle>
        <circle cx="40" cy="134" r="1.2" opacity=".8"></circle>
        <circle cx="340" cy="140" r="1" opacity=".7"></circle>
        <circle cx="62" cy="168" r="1" opacity=".7"></circle>
        <circle cx="322" cy="172" r="1.1" opacity=".75"></circle>
      </svg>
    </div>
    <div class="glow" id="glow"></div>
    <div class="horizon" id="horizon"></div>
    <div class="orb moon" id="orb" style="left: 304px; top: 24px; width: 30px; height: 30px;"></div>

    <div class="clock">
      <svg id="clk" viewBox="0 0 300 300" role="img" aria-label="clock">
        <circle cx="150" cy="150" r="146" fill="#fffdf8" stroke="#0d6d74" stroke-width="6"></circle>
        <circle cx="150" cy="150" r="137" fill="none" stroke="#dcefe8" stroke-width="2"></circle>

        <g id="ticks"></g>
        <g id="nums"></g>

        <g id="hh">
          <line x1="150" y1="158" x2="150" y2="92" stroke="#2f4a51" stroke-width="8" stroke-linecap="round"></line>
        </g>
        <g id="mh">
          <line x1="150" y1="164" x2="150" y2="46" stroke="#0d6d74" stroke-width="5" stroke-linecap="round"></line>
        </g>
        <g id="sh">
          <line x1="150" y1="176" x2="150" y2="40" stroke="#e0454a" stroke-width="2" stroke-linecap="round"></line>
          <circle cx="150" cy="167" r="3.4" fill="#e0454a"></circle>
          <circle cx="150" cy="40" r="3.6" fill="#e0454a"></circle>
        </g>

        <circle cx="150" cy="150" r="7" fill="#0d6d74"></circle>
        <circle cx="150" cy="150" r="2.6" fill="#ffcf3f"></circle>
      </svg>
    </div>
  </div>

  <!-- how it is said -->
  <div class="say"><span id="saytext"><b>Midnight</b> · twelve o’clock at night.</span></div>

  <!-- table + digital time -->
  <div class="row2">
    <div class="tblwrap">
      <table class="tbl">
        <thead>
          <tr><th>Hour</th><th>Minutes</th><th>Seconds</th></tr>
        </thead>
        <tbody>
          <tr><td id="vh">00</td><td id="vm">00</td><td id="vs">00</td></tr>
        </tbody>
      </table>
    </div>
    <div class="dcard">
      <div class="dtime" id="dtime">00 00 00</div>
      <div class="dtag" id="dtag">Midnight</div>
    </div>
  </div>

  <div class="btnwrap">
    <button class="next" type="button" id="next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11.5a8 8 0 1 1-2.4-5.7"></path>
        <path d="M20 3.5v5h-5"></path>
      </svg>
      Next
    </button>
  </div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var CX = 150, CY = 150;

  /* ---------- clock face ---------- */
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180;
    var hour = (i % 5 === 0);
    var r1 = hour ? 129 : 134;
    var r2 = 141;
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (CX + r1 * Math.sin(a)).toFixed(2));
    l.setAttribute('y1', (CY - r1 * Math.cos(a)).toFixed(2));
    l.setAttribute('x2', (CX + r2 * Math.sin(a)).toFixed(2));
    l.setAttribute('y2', (CY - r2 * Math.cos(a)).toFixed(2));
    l.setAttribute('stroke', hour ? '#5f848a' : '#a9c8c1');
    l.setAttribute('stroke-width', hour ? 3 : 1.2);
    l.setAttribute('stroke-linecap', 'round');
    ticks.appendChild(l);
  }

  var nums = document.getElementById('nums');
  for (var n = 1; n <= 12; n++) {
    var ang = n * 30 * Math.PI / 180;
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', (CX + 104 * Math.sin(ang)).toFixed(2));
    t.setAttribute('y', (CY - 104 * Math.cos(ang)).toFixed(2));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-family', 'Verdana, "Nirmala UI", sans-serif');
    t.setAttribute('font-size', '31');
    t.setAttribute('font-weight', 'bold');
    t.setAttribute('fill', '#2f4a51');
    t.textContent = n;
    nums.appendChild(t);
  }

  /* ---------- scenes (night / day) ---------- */
  var SCENES = [
    { sky: 'linear-gradient(180deg,#050b16 0%,#0b1729 55%,#16243c 100%)', stars: 1, orb: 'moon', ox: 304, oy: 24, os: 30, glow: .10, horizon: 0 },
    { sky: 'linear-gradient(180deg,#070f1e 0%,#0e1c31 60%,#1a2b45 100%)', stars: .9, orb: 'moon', ox: 312, oy: 30, os: 26, glow: .12, horizon: 0 },
    { sky: 'linear-gradient(180deg,#16233f 0%,#28395c 52%,#6b5566 78%,#c68a5c 100%)', stars: .3, orb: 'sun', ox: 46, oy: 148, os: 34, glow: .34, horizon: 1 },
    { sky: 'linear-gradient(180deg,#cfe6fb 0%,#e8f3fd 55%,#fff3d6 100%)', stars: 0, orb: 'sun', ox: 300, oy: 26, os: 30, glow: .4, horizon: .35 },
    { sky: 'linear-gradient(180deg,#e8f6ff 0%,#f9fdff 60%,#ffffff 100%)', stars: 0, orb: 'sun', ox: 306, oy: 20, os: 26, glow: .45, horizon: 0 },
    { sky: 'linear-gradient(180deg,#f4fbff 0%,#ffffff 100%)', stars: 0, orb: 'sun', ox: 300, oy: 18, os: 32, glow: .5, horizon: 0 },
    { sky: 'linear-gradient(180deg,#e9b47c 0%,#cd7f54 52%,#8d4a46 100%)', stars: 0, orb: 'sun', ox: 42, oy: 144, os: 34, glow: .34, horizon: .8 },
    { sky: 'linear-gradient(180deg,#20304f 0%,#0f1b30 55%,#07101f 100%)', stars: .75, orb: 'moon', ox: 310, oy: 26, os: 28, glow: .14, horizon: 0 },
    { sky: 'linear-gradient(180deg,#0a1322 0%,#060c16 60%,#03060d 100%)', stars: 1, orb: 'moon', ox: 302, oy: 22, os: 30, glow: .10, horizon: 0 }
  ];

  var stage = document.getElementById('stage');
  var glow = document.getElementById('glow');
  var stars = document.getElementById('stars');
  var horizon = document.getElementById('horizon');
  var orb = document.getElementById('orb');

  function paintScene(k) {
    var s = SCENES[k];
    stage.style.background = s.sky;
    glow.style.opacity = s.glow;
    stars.style.opacity = s.stars;
    horizon.style.opacity = s.horizon;
    orb.className = 'orb ' + s.orb;
    orb.style.left = s.ox + 'px';
    orb.style.top = s.oy + 'px';
    orb.style.width = s.os + 'px';
    orb.style.height = s.os + 'px';
  }

  /* ---------- 9 times ---------- */
  var STEPS = [
    { h: 0,  m: 0,  s: 0,  say: '<b>Midnight</b> · twelve o’clock at night.', tag: 'Midnight', sc: 0 },
    { h: 2,  m: 15, s: 30, say: '<b>Early morning</b> · 15 minutes and 30 seconds past 2.', tag: 'AM · before noon', sc: 1 },
    { h: 6,  m: 30, s: 45, say: '<b>Dawn</b> · 30 minutes and 45 seconds past 6.', tag: 'AM · before noon', sc: 2 },
    { h: 8,  m: 40, s: 0,  say: '<b>Morning</b> · 40 minutes past 8.', tag: 'AM · before noon', sc: 3 },
    { h: 11, m: 5,  s: 30, say: '<b>Late morning</b> · 5 minutes and 30 seconds past 11.', tag: 'AM · before noon', sc: 4 },
    { h: 12, m: 0,  s: 0,  say: '<b>Noon</b> · twelve o’clock.', tag: 'Noon', sc: 5 },
    { h: 17, m: 15, s: 30, say: '<b>Evening</b> · 15 minutes and 30 seconds past 5.', tag: 'PM · after noon', sc: 6 },
    { h: 19, m: 20, s: 50, say: '<b>Night</b> · 20 minutes and 50 seconds past 7.', tag: 'PM · after noon', sc: 7 },
    { h: 22, m: 30, s: 0,  say: '<b>Night</b> · half past ten.', tag: 'PM · after noon', sc: 8 }
  ];

  var hh = document.getElementById('hh');
  var mh = document.getElementById('mh');
  var sh = document.getElementById('sh');
  var say = document.getElementById('saytext');
  var vh = document.getElementById('vh');
  var vm = document.getElementById('vm');
  var vs = document.getElementById('vs');
  var dtime = document.getElementById('dtime');
  var dtag = document.getElementById('dtag');

  var cur = 0;

  function pad2(v) { return v < 10 ? '0' + v : '' + v; }

  function show(k) {
    cur = k;
    var d = STEPS[k];

    var hAng = (d.h % 12) * 30 + d.m * 0.5 + d.s * (0.5 / 60);
    hh.setAttribute('transform', 'rotate(' + hAng.toFixed(2) + ' ' + CX + ' ' + CY + ')');
    mh.setAttribute('transform', 'rotate(' + (d.m * 6 + d.s * 0.1).toFixed(2) + ' ' + CX + ' ' + CY + ')');
    sh.setAttribute('transform', 'rotate(' + (d.s * 6) + ' ' + CX + ' ' + CY + ')');

    var h12 = d.h;
    if (h12 > 12) h12 -= 12;

    say.innerHTML = d.say;
    vh.textContent = pad2(h12);
    vm.textContent = pad2(d.m);
    vs.textContent = pad2(d.s);

    dtime.textContent = pad2(h12) + ' ' + pad2(d.m) + ' ' + pad2(d.s);
    dtag.textContent = d.tag;

    paintScene(d.sc);
  }

  document.getElementById('next').addEventListener('click', function () {
    show((cur + 1) % STEPS.length);
  });

  show(0);
})();
</script>
</body>
</html>
