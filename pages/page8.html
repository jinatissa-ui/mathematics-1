<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     8 · Number Zones and Place Value
     ============================================================ */
  :root {
    --z-b: #c1267b;  --zb-b: #fdeef6;   /* billions */
    --z-m: #7b3fc4;  --zb-m: #f5eeff;   /* millions */
    --z-k: #2a68c1;  --zb-k: #ecf4fe;   /* thousands */
    --z-u: #e2541f;  --zb-u: #fff3eb;   /* units */
  }

  .ttl { font-size: 26px; }
  .sub { font-size: 14px; letter-spacing: 2.5px; }

  .lead {
    margin-top: 6px;
    font-size: 16px;
    line-height: 1.25;
    color: var(--ink-soft);
  }

  /* ---------- the number ---------- */
  .ncard {
    margin-top: 8px;
    padding: 9px 9px 10px;
    border-radius: 14px;
    background: #fff;
    border: 1.5px solid #dbe9e6;
    box-shadow: 0 4px 10px rgba(30, 80, 80, .07);
  }
  .raw {
    text-align: center;
    font-family: Verdana, sans-serif;
    font-size: 31px;
    font-weight: bold;
    line-height: 1.15;
    letter-spacing: 1px;
    color: var(--teal);
    white-space: nowrap;
  }
  .method {
    text-align: center;
    font-size: 14px;
    line-height: 1.2;
    color: var(--muted);
  }

  .groups {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }
  .grp { width: 85px; text-align: center; }
  .ghead {
    font-size: 11.5px;
    letter-spacing: -.1px;
    line-height: 1.15;
    font-weight: bold;
  }
  .gtiles {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin-top: 4px;
  }

  .tile {
    width: 27px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    font-family: Verdana, sans-serif;
    font-size: 28px;
    font-weight: bold;
    line-height: 1;
    border-bottom: 3px solid;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile:active { transform: translateY(1px); }

  .tile.zb, .ghead.zb { color: var(--z-b); }
  .tile.zm, .ghead.zm { color: var(--z-m); }
  .tile.zk, .ghead.zk { color: var(--z-k); }
  .tile.zu, .ghead.zu { color: var(--z-u); }

  .tile.zb { background: var(--zb-b); border-color: var(--z-b); }
  .tile.zm { background: var(--zb-m); border-color: var(--z-m); }
  .tile.zk { background: var(--zb-k); border-color: var(--z-k); }
  .tile.zu { background: var(--zb-u); border-color: var(--z-u); }

  .tile.sel { color: #fff; transform: translateY(-3px); }
  .tile.zb.sel { background: var(--z-b); box-shadow: 0 4px 9px rgba(193, 38, 123, .35); }
  .tile.zm.sel { background: var(--z-m); box-shadow: 0 4px 9px rgba(123, 63, 196, .35); }
  .tile.zk.sel { background: var(--z-k); box-shadow: 0 4px 9px rgba(42, 104, 193, .35); }
  .tile.zu.sel { background: var(--z-u); box-shadow: 0 4px 9px rgba(226, 84, 31, .35); }

  /* ---------- the value ---------- */
  .vcard {
    margin-top: 9px;
    min-height: 136px;
    padding: 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--mint);
    border: 1px solid var(--mint-line);
    text-align: center;
  }
  .vhint {
    font-size: 16px;
    line-height: 1.45;
    color: var(--muted);
  }
  .vbody { display: none; }
  .vcard.on .vhint { display: none; }
  .vcard.on .vbody { display: block; }

  .v1 {
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink);
  }
  .v1 b {
    font-family: Verdana, sans-serif;
    font-size: 20px;
    font-weight: bold;
    padding: 0 1px;
  }
  .v1 b.zb { color: var(--z-b); }
  .v1 b.zm { color: var(--z-m); }
  .v1 b.zk { color: var(--z-k); }
  .v1 b.zu { color: var(--z-u); }

  .v2 {
    margin-top: 5px;
    font-size: 21px;
    line-height: 1.3;
    font-weight: bold;
    color: var(--green);
  }
  .v3 {
    margin-top: 5px;
    font-family: Verdana, sans-serif;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: .5px;
    color: var(--teal);
    white-space: nowrap;
  }

  /* ---------- button ---------- */
  .actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
  }
  .nextBtn {
    width: 178px;
    height: 40px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #17b183, #0b8058);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: .3px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(9, 110, 79, .3), 0 6px 12px rgba(13, 138, 100, .18);
  }
  .nextBtn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(9, 110, 79, .3);
  }
  .counter {
    height: 26px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    border-radius: 999px;
    background: #eef7f4;
    border: 1px solid #d5e9e2;
    font-family: Verdana, sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: var(--teal);
  }

  .hint b { color: var(--green); }
</style>
</head>
<body class="en">
  <div class="sheet">
    <h5 class="ttl">Number Zones &amp; Place Value</h5>
    <div class="sub">NUMBER ZONES &amp; PLACE VALUE</div>
    <div class="lead">Tap a digit to see its value</div>

    <div class="ncard">
      <div class="raw" id="raw">524842425357</div>
      <div class="method">Separate the digits in groups of 3, from the right</div>
      <div class="groups" id="groups"></div>
    </div>

    <div class="vcard" id="vcard">
      <div class="vhint">Tap a digit above ↑</div>
      <div class="vbody">
        <div class="v1" id="v1"></div>
        <div class="v2" id="v2"></div>
        <div class="v3" id="v3"></div>
      </div>
    </div>

    <div class="actions">
      <button class="nextBtn" id="nextBtn">Next number</button>
      <span class="counter" id="counter">1 / 10</span>
    </div>

    <div class="hint">Value of a digit = <b>digit × place value</b></div>
  </div>

<script>
  /* ================= data ================= */
  var ZONES = [
    { key: 'zb', name: 'Billions' },
    { key: 'zm', name: 'Millions' },
    { key: 'zk', name: 'Thousands' },
    { key: 'zu', name: 'Units' }
  ];

  var PLACES = [
    'ones', 'tens', 'hundreds',
    'thousands', 'ten-thousands', 'hundred-thousands',
    'millions', 'ten-millions', 'hundred-millions',
    'billions', 'ten-billions', 'hundred-billions'
  ];

  var NUMBERS = [
    524842425357,
    731209856404,
    908000406530,
    250000000301,
    456789012345,
    100000000000,
    875634129008,
    600035700240,
    999999999999,
    123456789012
  ];

  var idx = 0;

  function d(id) { return document.getElementById(id); }

  /* ---------- English words ---------- */
  var ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  var TEENS = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  var TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  var HUND = ['', 'one hundred', 'two hundred', 'three hundred', 'four hundred', 'five hundred', 'six hundred', 'seven hundred', 'eight hundred', 'nine hundred'];

  function comb2(n) {
    if (n < 10) return ONES[n];
    if (n < 20) return TEENS[n - 10];
    var t = Math.floor(n / 10), u = n % 10;
    return u ? TENS[t] + '-' + ONES[u] : TENS[t];
  }
  function comb(n) {
    var h = Math.floor(n / 100), r = n % 100;
    if (!h) return comb2(r);
    return r ? HUND[h] + ' and ' + comb2(r) : HUND[h];
  }
  function abs2(n) { return comb2(n); }

  /* add the scale word after the digit’s value */
  function thWord(x) { return ONES[x]; }

  function valueWords(dig, p) {
    if (dig === 0) return 'zero';
    switch (p) {
      case 0:  return ONES[dig];
      case 1:  return comb2(dig * 10);
      case 2:  return HUND[dig];
      case 3:  return thWord(dig) + ' thousand';
      case 4:  return comb2(dig * 10) + ' thousand';
      case 5:  return HUND[dig] + ' thousand';
      case 6:  return comb(dig) + ' million';
      case 7:  return comb2(dig * 10) + ' million';
      case 8:  return HUND[dig] + ' million';
      case 9:  return comb(dig) + ' billion';
      case 10: return comb2(dig * 10) + ' billion';
      case 11: return HUND[dig] + ' billion';
    }
    return '';
  }

  function fmt(v) {
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
  }

  /* ================= draw the page ================= */
  function drawNumber(animate) {
    var s = String(NUMBERS[idx]), html = '';
    for (var g = 0; g < 4; g++) {
      var z = ZONES[g];
      html += '<div class="grp"><div class="ghead ' + z.key + '">' + z.name + '</div><div class="gtiles">';
      for (var j = 0; j < 3; j++) {
        var i = g * 3 + j;
        html += '<b class="tile ' + z.key + '" data-i="' + i + '">' + s.charAt(i) + '</b>';
      }
      html += '</div></div>';
    }
    d('groups').innerHTML = html;
    d('raw').textContent = s;

    d('counter').textContent = (idx + 1) + ' / ' + NUMBERS.length;
    clearValue();
  }

  function clearValue() {
    d('vcard').classList.remove('on');
    var tl = document.querySelectorAll('.tile.sel');
    for (var k = 0; k < tl.length; k++) tl[k].classList.remove('sel');
  }

  function pick(tile) {
    var i = Number(tile.getAttribute('data-i')),
        p = 11 - i,
        dig = Number(tile.textContent),
        key = ZONES[Math.floor(i / 3)].key;

    var tl = document.querySelectorAll('.tile.sel');
    for (var k = 0; k < tl.length; k++) tl[k].classList.remove('sel');
    tile.classList.add('sel');

    d('v1').innerHTML = 'The digit <b class="' + key + '">' + dig + '</b> in the ' + PLACES[p] + ' place' ;
    d('v2').textContent = valueWords(dig, p);
    d('v3').textContent = fmt(dig * Math.pow(10, p));
    d('vcard').classList.add('on');

    pop(520 + p * 12, .1);
  }

  d('groups').addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (t) pick(t);
  });

  d('nextBtn').addEventListener('click', function () {
    idx = (idx + 1) % NUMBERS.length;
    drawNumber(true);
    pop(620, .12);
  });

  /* ================= sound ================= */
  var actx = null;
  function pop(freq, vol) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, actx.currentTime + .1);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .2);
      o.connect(g);
      g.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + .22);
    } catch (e) {}
  }

  /* ================= start ================= */
  drawNumber(false);
</script>
</body>
</html>
