<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     50 · units of time — a top-to-bottom list + overlay on click
     ============================================================ */
  .ttl { flex: none; font-size: 24px; }
  .sub { flex: none; margin-top: 0; font-size: 14px; letter-spacing: 2px; }

  .tip {
    flex: none;
    margin-top: 6px;
    height: 23px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-radius: 7px;
    background: var(--mint);
    border: 1px solid var(--mint-line);
    font-size: 14px;
    color: #3f6a70;
  }
  .tip svg { width: 13px; height: 13px; flex: none; }

  /* ---------- the units list ---------- */
  .list {
    flex: 1;
    min-height: 0;
    margin-top: 7px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .urow {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 0 11px;
    border-radius: 11px;
    border: 1px solid #d5eee6;
    background: #fff;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
  }
  .urow:hover, .urow:focus-visible {
    border-color: #9fd6c4;
    background: #f9fefc;
    box-shadow: 0 4px 10px rgba(13, 109, 116, .1);
    outline: none;
  }
  .urow:active { transform: scale(.99); }
  .urow.on { border-color: #35a58c; background: #f4fdf9; box-shadow: 0 0 0 2px rgba(53, 165, 140, .18); }

  .ubadge {
    flex: none;
    width: 35px;
    height: 35px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ubadge svg { width: 22px; height: 22px; display: block; }
  .b0 { background: #ffeef4; }
  .b1 { background: #eaf4ff; }
  .b2 { background: #fff3e2; }
  .b3 { background: #eefaf2; }
  .b4 { background: #f4efff; }
  .b5 { background: #fff6e6; }
  .b6 { background: #e9f8f7; }

  .utx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .utx b {
    font-size: 21px;
    line-height: 1.16;
    font-weight: bold;
    color: #2f4a51;
    white-space: nowrap;
  }
  .utx span {
    font-size: 14px;
    line-height: 1.2;
    letter-spacing: 1.2px;
    font-weight: bold;
    font-family: Georgia, "Times New Roman", serif;
    color: #9a8f88;
  }
  .chev { flex: none; font-size: 20px; line-height: 1; color: #9fc4bd; }

  /* ---------- overlay ---------- */
  .pop {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 45, 45, .32);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .pop.on { opacity: 1; pointer-events: auto; }

  .pcard {
    position: relative;
    width: 352px;
    padding: 12px 14px 13px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .32);
    transform: translateY(10px) scale(.97);
    transition: transform .2s ease;
  }
  .pop.on .pcard { transform: translateY(0) scale(1); }

  .phead { display: flex; align-items: baseline; gap: 7px; padding-right: 28px; }
  .pname { font-size: 21px; line-height: 1.2; font-weight: bold; color: var(--teal); }
  .pen {
    font-size: 14px;
    line-height: 1.2;
    letter-spacing: 1.2px;
    font-weight: bold;
    font-family: Georgia, "Times New Roman", serif;
    color: #9a8f88;
  }
  .px {
    position: absolute;
    right: 9px;
    top: 9px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0;
    background: #eef4f2;
    color: #5d7f83;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }
  .px:hover { background: #e2ece9; }

  .pimg {
    margin-top: 7px;
    height: 142px;
    border-radius: 11px;
    overflow: hidden;
    background: #f6fbf8;
    border: 1px solid #dff0e9;
    line-height: 0;
  }
  .pimg svg { display: block; width: 100%; height: 100%; }

  .pdesc {
    margin-top: 7px;
    min-height: 44px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  .relwrap { margin-top: 7px; padding-top: 6px; border-top: 1px dashed #dbeee7; }
  .rellab { font-size: 14px; line-height: 1.2; font-weight: bold; color: var(--green); margin-bottom: 4px; }
  .rel {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding: 0 8px;
    border-radius: 9px;
    font-size: 16px;
    line-height: 1.2;
    font-weight: bold;
    color: #a45600;
    background: #fff1c9;
    white-space: nowrap;
    animation: rblink 1.15s ease-in-out infinite;
  }
  @keyframes rblink {
    0%, 100% { background: #fff1c9; box-shadow: 0 0 0 0 rgba(255, 207, 63, 0); }
    50%      { background: #ffdf8e; box-shadow: 0 0 0 2px rgba(255, 207, 63, .35); }
  }
</style>
</head>

      </div>
    </div>
  </div>
</div>
