<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     47 · Let's make angles — tap grid points on squared paper to draw lines
     ============================================================ */
  .ttl { flex: none; font-size: 24px; }
  .sub { flex: none; margin-top: 0; font-size: 14px; letter-spacing: 2px; }

  .strip {
    flex: none;
    height: 20px;
    margin-top: 3px;
    padding: 0 8px;
    border-radius: 7px;
    background: var(--mint);
    border: 1px solid var(--mint-line);
    font-size: 14px;
    line-height: 18px;
    color: #3f6a70;
    white-space: nowrap;
    overflow: hidden;
  }
  .strip b { color: var(--green); }

  /* ---------- the squared paper ---------- */
  .pad {
    position: relative;
    flex: 1;
    min-height: 0;
    margin-top: 4px;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #fbfefc 100%);
    box-shadow: inset 0 0 0 1px #d5eee6, 0 2px 7px rgba(30, 80, 80, .05);
    overflow: hidden;
    line-height: 0;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #grid line { stroke: #d3e8e1; stroke-width: 1; }
  #grid line.edge { stroke: #b9dbd1; }
  #grid line.edge2 { stroke: #c6e2da; }

  .ln { fill: none; stroke: #2b5561; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .pt { fill: #0d6d74; stroke: #fff; stroke-width: 1.3; }
  .pt.pen { fill: #e8a80f; stroke: #fff; stroke-width: 1.5; }

  #preln { stroke: #0d6d74; stroke-width: 2; stroke-dasharray: 5 4; stroke-linecap: round; opacity: .62; }
  #pretip { fill: #0d6d74; opacity: .5; }
  #hov { fill: none; stroke: #0d6d74; stroke-width: 1.4; opacity: .38; }

  /* ---------- bottom bar ---------- */
  .foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 32px;
    margin-top: 5px;
  }
  .stat {
    font-size: 14px;
    font-weight: bold;
    color: var(--muted);
    white-space: nowrap;
  }
  .stat b { font-family: Verdana, sans-serif; font-size: 15px; color: var(--teal); }
  .und {
    margin-left: auto;
    flex: 0 0 38px;
    height: 32px;
    border-radius: 10px;
    border: 1.5px solid #9fd6c4;
    background: #fff;
    color: var(--teal);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .und:active { transform: translateY(1px); }
  .clr {
    flex: 0 0 88px;
    height: 32px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(140deg, #13a675, #0c7c5a);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(13, 128, 94, .25);
    -webkit-tap-highlight-color: transparent;
  }
  .clr:active { transform: translateY(1px); }
</style>
</head>
<body class="en">
<div class="sheet">
  <div class="ttl">Drawing Angles</div>
  <div class="sub">DRAW ANGLES</div>

  <div class="strip">Tap a grid point to draw · <b>tap twice to stop</b></div>

  <div class="pad" id="pad">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <g id="grid"></g>
      <g id="ink"></g>
      <g id="pre" style="display:none">
        <line id="preln" x1="0" y1="0" x2="0" y2="0"></line>
        <circle id="pretip" cx="0" cy="0" r="3.4"></circle>
      </g>
      <circle id="hov" cx="0" cy="0" r="4.6" style="display:none"></circle>
    </svg>
  </div>

  <div class="foot">
    <span class="stat" id="stat">Lines <b>0</b></span>
    <button class="und" id="und" type="button" title="Remove last part" aria-label="Remove last part">↶</button>
    <button class="clr" id="clr" type="button">Clear</button>
  </div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var pad  = document.getElementById('pad');
  var cv   = document.getElementById('cv');
  var grid = document.getElementById('grid');
  var ink  = document.getElementById('ink');
  var pre  = document.getElementById('pre');
  var preln = document.getElementById('preln');
  var pretip = document.getElementById('pretip');
  var hov  = document.getElementById('hov');
  var stat = document.getElementById('stat');

  /* ---------- viewBox = real page size (lines stay sharp) ---------- */
  var W = pad.clientWidth;
  var H = pad.clientHeight;
  cv.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  cv.setAttribute('width', W);
  cv.setAttribute('height', H);

  /* ---------- a 9 × 9 grid (big squares) ---------- */
  var NX = 9, NY = 9;
  var CELL = Math.floor(Math.min((W - 10) / NX, (H - 10) / NY));
  var X0 = Math.round((W - NX * CELL) / 2);
  var Y0 = Math.round((H - NY * CELL) / 2);

  (function drawGrid() {
    var i, l;
    for (i = 0; i <= NX; i++) {
      l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', X0 + i * CELL);
      l.setAttribute('x2', X0 + i * CELL);
      l.setAttribute('y1', Y0);
      l.setAttribute('y2', Y0 + NY * CELL);
      l.setAttribute('class', (i === 0 || i === NX) ? 'edge' : (i % 3 === 0 ? 'edge2' : ''));
      grid.appendChild(l);
    }
    for (i = 0; i <= NY; i++) {
      l = document.createElementNS(NS, 'line');
      l.setAttribute('y1', Y0 + i * CELL);
      l.setAttribute('y2', Y0 + i * CELL);
      l.setAttribute('x1', X0);
      l.setAttribute('x2', X0 + NX * CELL);
      l.setAttribute('class', (i === 0 || i === NY) ? 'edge' : (i % 3 === 0 ? 'edge2' : ''));
      grid.appendChild(l);
    }
  })();

  /* ---------- state ---------- */
  var chains = [];      /* finished lines (lists of points) */
  var pts = [];         /* points of the line being drawn now */
  var active = false;
  var just = false;     /* ignore the release of the first tap */
  var cur = null;

  function segs() {
    var n = 0, i;
    for (i = 0; i < chains.length; i++) n += chains[i].length - 1;
    if (active && pts.length > 1) n += pts.length - 1;
    return n;
  }

  function status() {
    stat.innerHTML = 'Lines <b>' + segs() + '</b>';
  }

  function dot(x, y, pen) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', pen ? 4.2 : 3);
    c.setAttribute('class', pen ? 'pt pen' : 'pt');
    ink.appendChild(c);
  }

  function poly(list) {
    var pl = document.createElementNS(NS, 'polyline');
    var s = [], i;
    for (i = 0; i < list.length; i++) s.push(list[i][0] + ',' + list[i][1]);
    pl.setAttribute('points', s.join(' '));
    pl.setAttribute('class', 'ln');
    ink.appendChild(pl);
  }

  function draw() {
    while (ink.firstChild) ink.removeChild(ink.firstChild);
    var i, j, list;
    for (i = 0; i < chains.length; i++) {
      list = chains[i];
      if (list.length > 1) poly(list);
      for (j = 0; j < list.length; j++) dot(list[j][0], list[j][1], false);
    }
    if (active && pts.length) {
      if (pts.length > 1) poly(pts);
      for (j = 0; j < pts.length; j++) dot(pts[j][0], pts[j][1], j === pts.length - 1);
    }
  }

  function hidePre() {
    pre.style.display = 'none';
  }

  function showPre(to) {
    var last = pts[pts.length - 1];
    if (!last || !to) { hidePre(); return; }
    if (last[0] === to[0] && last[1] === to[1]) { hidePre(); return; }
    preln.setAttribute('x1', last[0]);
    preln.setAttribute('y1', last[1]);
    preln.setAttribute('x2', to[0]);
    preln.setAttribute('y2', to[1]);
    pretip.setAttribute('cx', to[0]);
    pretip.setAttribute('cy', to[1]);
    pre.style.display = '';
  }

  /* ---------- snap to a grid point ---------- */
  function gp(e) {
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) * (W / r.width);
    var y = (e.clientY - r.top) * (H / r.height);
    var i = Math.round((x - X0) / CELL);
    var j = Math.round((y - Y0) / CELL);
    if (i < 0) i = 0; else if (i > NX) i = NX;
    if (j < 0) j = 0; else if (j > NY) j = NY;
    return [X0 + i * CELL, Y0 + j * CELL];
  }

  function same(a, b) { return a && b && a[0] === b[0] && a[1] === b[1]; }

  function down(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var p = gp(e);
    cur = p;
    if (!active) {
      pts = [p];
      active = true;
      draw();
      showPre(p);
      just = true;
    }
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }

  function move(e) {
    var p = gp(e);
    cur = p;
    hov.setAttribute('cx', p[0]);
    hov.setAttribute('cy', p[1]);
    hov.style.display = '';
    if (active) showPre(p);
  }

  function up(e) {
    var p = gp(e);
    if (just) {
      just = false;
      if (!same(p, pts[0])) {          /* if dragged and released, draw from there */
        pts.push(p);
        draw();
        status();
      }
      hidePre();
      return;
    }
    if (!active) return;

    if (same(p, pts[pts.length - 1])) {  /* twice on the last point → stop */
      if (pts.length > 1) {
        chains.push(pts);
      }
      active = false;
      pts = [];
      hidePre();
      draw();
      status();
      return;
    }

    pts.push(p);
    draw();
    status();
    showPre(p);
  }

  function leave() {
    hov.style.display = 'none';
  }

  cv.addEventListener('pointerdown', down);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', function () { just = false; hidePre(); });
  cv.addEventListener('pointerleave', leave);
  cv.addEventListener('pointerenter', function () {});
  cv.addEventListener('dblclick', function (e) {
    e.preventDefault();
    /* if the line was stopped by double-tapping the last point, remove
       the single point (gold dot) that the second tap started */
    if (active && pts.length === 1) {
      active = false;
      pts = [];
      just = false;
      hidePre();
      draw();
      status();
    }
  });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- removing ---------- */
  document.getElementById('und').addEventListener('click', function () {
    if (active) {
      if (pts.length > 1) pts.pop();
      else { active = false; pts = []; }
    } else if (chains.length) {
      var c = chains[chains.length - 1];
      c.pop();
      if (c.length < 2) chains.pop();
    }
    hidePre();
    draw();
    status();
  });

  document.getElementById('clr').addEventListener('click', function () {
    chains = [];
    pts = [];
    active = false;
    just = false;
    hidePre();
    draw();
    status();
  });

  draw();
  status();
})();
</script>
</body>
</html>
