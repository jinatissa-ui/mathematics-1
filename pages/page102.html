<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Square Numbers</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     102 · Square Numbers
     (ball arrays · 1, 4, 9, 16 · 5th one 5 × 5 = 25)
     ============================================================ */
  .ttl { flex: none; font-size: 25px; line-height: 1.1; white-space: nowrap; }
  .sub { flex: none; margin-top: 2px; font-size: 13px; letter-spacing: 1.8px; }

  /* ---------- definition ---------- */
  .def {
    flex: none;
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 12px;
    background: #fffdf4;
    border: 1px solid #f2e6bd;
    box-shadow: 0 4px 10px rgba(120, 100, 40, .05);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 13px;
    line-height: 1.35;
    color: #6f6650;
  }
  .def .dot { flex: none; width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: #f6c945; }
  .def b { color: #8a5b00; }

  /* ---------- balls ---------- */
  .ball {
    display: block;
    border-radius: 50%;
    background:
      radial-gradient(circle at 33% 27%, rgba(255, 255, 255, .95) 0 10%, rgba(255, 255, 255, 0) 32%),
      radial-gradient(circle at 35% 30%, #7fe3c8 0%, #2cb890 40%, #0d8a64 72%, #076a4d 100%);
    box-shadow: inset 0 -1px 2px rgba(0, 50, 35, .28), 0 1px 2px rgba(20, 60, 50, .18);
  }
  .bg { display: grid; justify-content: center; align-content: center; }
  .bg i { border-radius: 50%; }

  /* ---------- examples ---------- */
  .excard {
    flex: none;
    margin-top: 7px;
    padding: 6px 10px 7px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 5px 12px rgba(30, 80, 80, .06);
  }
  .eh { display: flex; align-items: center; gap: 7px; height: 20px; }
  .eh .eb {
    flex: none;
    height: 20px;
    padding: 0 7px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    background: #0d6d74;
    color: #fff;
    font-size: 10.5px;
    font-weight: bold;
  }
  .eh .et { font-size: 12px; color: #6f7f7c; }
  .eh .er { margin-left: auto; font-family: Verdana, sans-serif; font-size: 10.5px; color: #a3b1ae; }
  .exs { display: flex; gap: 5px; margin-top: 5px; }
  .ex { flex: 1; min-width: 0; }
  .well {
    height: 58px;
    border-radius: 10px;
    background: #fbfdfc;
    border: 1.5px dashed #d8e6e2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .well .bg { grid-auto-flow: row; }
  .w1 { grid-template-columns: repeat(1, 32px); }
  .w1 i { width: 32px; height: 32px; }
  .w2 { grid-template-columns: repeat(2, 20px); gap: 4px; }
  .w2 i { width: 20px; height: 20px; }
  .w3 { grid-template-columns: repeat(3, 14px); gap: 3px; }
  .w3 i { width: 14px; height: 14px; }
  .w4 { grid-template-columns: repeat(4, 10.5px); gap: 3px; }
  .w4 i { width: 10.5px; height: 10.5px; }
  .eq {
    margin-top: 4px;
    text-align: center;
    font-family: Verdana, sans-serif;
    font-size: 10px;
    font-weight: bold;
    color: #6f7f7c;
    white-space: nowrap;
  }
  .eq b { color: #0d6d74; }
  .eq .v {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 17px;
    padding: 0 3px;
    margin-left: 2px;
    border-radius: 5px;
    background: #fff3d2;
    border: 1px solid #f0d795;
    color: #9a6a08;
    font-size: 10px;
  }

  /* ---------- 5th number ---------- */
  .hero {
    flex: none;
    margin-top: 7px;
    padding: 8px 10px 9px;
    border-radius: 14px;
    background: #f2fbf7;
    border: 1px solid #d5eee6;
    box-shadow: 0 5px 12px rgba(13, 138, 100, .08);
  }
  .hh { display: flex; align-items: center; gap: 7px; height: 21px; }
  .hh .hb {
    flex: none;
    height: 21px;
    padding: 0 8px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    background: #e8a020;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
  }
  .hh .ht { font-size: 13px; font-weight: bold; color: #0d6d74; }
  .hh .hc { margin-left: auto; font-size: 10.5px; color: #8aa39e; }
  .hbody { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  .hgrid {
    flex: none;
    width: 134px;
    height: 134px;
    border-radius: 12px;
    background: #fff;
    border: 1.5px dashed #bfe4d8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hgrid .bg { grid-template-columns: repeat(5, 21px); gap: 4px; }
  .hgrid .bg i { width: 21px; height: 21px; }
  .heq { flex: 1; min-width: 0; }
  .m {
    font-family: Verdana, sans-serif;
    font-size: 27px;
    font-weight: bold;
    color: #2c4c53;
    line-height: 1.1;
    letter-spacing: .5px;
  }
  .rr { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  .rr .eqs { font-family: Verdana, sans-serif; font-size: 22px; font-weight: bold; color: #0d8a64; }
  .rr .v25 {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 28%, #ffd98a, #e8a020 62%, #c17f0a);
    border: 2px solid #fff;
    box-shadow: 0 3px 8px rgba(180, 120, 10, .3);
    font-family: Verdana, sans-serif;
    font-size: 25px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 1px 1px rgba(120, 70, 0, .45);
  }
  .note { margin-top: 6px; font-size: 11px; color: #6f8b85; }

  /* ---------- footer ---------- */
  .foot {
    flex: none;
    margin-top: 7px;
    padding: 6px 10px;
    border-radius: 11px;
    background: #fffdf4;
    border: 1px solid #f2e6bd;
    text-align: center;
    font-size: 11.5px;
    line-height: 1.4;
    color: #6f6650;
  }
  .foot .seq { font-family: Verdana, sans-serif; font-size: 11.5px; font-weight: bold; color: #8a5b00; }
  .foot b { font-family: Verdana, sans-serif; }
</style>
</head>
<body class="en">
<div class="sheet">

  <div class="ttl">Square Numbers</div>
  <div class="sub">SQUARE NUMBERS</div>

  <div class="def">
    <span class="dot"></span>
    <span>Numbers whose balls can be arranged<br>in a <b>square</b> are <b>square numbers</b>.</span>
  </div>

  <div class="excard">
    <div class="eh">
      <span class="eb">Ex.</span>
      <span class="et">Let's arrange balls</span>
      <span class="er">n × n</span>
    </div>
    <div class="exs">
      <div class="ex">
        <div class="well"><div class="bg w1" data-n="1"></div></div>
        <div class="eq">1 × 1 = <span class="v">1</span></div>
      </div>
      <div class="ex">
        <div class="well"><div class="bg w2" data-n="2"></div></div>
        <div class="eq">2 × 2 = <span class="v">4</span></div>
      </div>
      <div class="ex">
        <div class="well"><div class="bg w3" data-n="3"></div></div>
        <div class="eq">3 × 3 = <span class="v">9</span></div>
      </div>
      <div class="ex">
        <div class="well"><div class="bg w4" data-n="4"></div></div>
        <div class="eq">4 × 4 = <span class="v">16</span></div>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hh">
      <span class="hb">5th</span>
      <span class="ht">square number</span>
      <span class="hc">25 balls</span>
    </div>
    <div class="hbody">
      <div class="hgrid"><div class="bg" id="b25"></div></div>
      <div class="heq">
        <div class="m">5 × 5</div>
        <div class="rr"><span class="eqs">=</span><span class="v25">25</span></div>
        <div class="note">5 rows · 5 columns</div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="seq">1, 4, 9, 16, 25, 36, 49, 64 …</span><br>
    Every square number can be written as <b>n × n</b>.
  </div>

</div>

<script>
(function () {
  function fill(el, n) {
    for (var i = 0; i < n * n; i++) {
      var b = document.createElement('i');
      b.className = 'ball';
      el.appendChild(b);
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.bg[data-n]'), function (el) {
    fill(el, parseInt(el.dataset.n, 10));
  });
  fill(document.getElementById('b25'), 5);
})();
</script>
</body>
</html>
