<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>Let's Check if a Number is Prime</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ============================================================
     101 · Let's check if a number is prime
     (number box · check button · answer · keypad)
     ============================================================ */
  .ttl { flex: none; font-size: 24px; line-height: 1.1; white-space: nowrap; }
  .sub { flex: none; margin-top: 2px; font-size: 12px; letter-spacing: 1.5px; }

  /* ---------- number box ---------- */
  .ncard {
    flex: none;
    margin-top: 7px;
    padding: 7px 10px 8px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e4eef0;
    box-shadow: 0 5px 12px rgba(30, 80, 80, .06);
  }
  .nl { display: flex; align-items: center; gap: 6px; height: 19px; }
  .nl .nb {
    flex: none;
    height: 19px;
    padding: 0 7px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    background: #0d6d74;
    color: #fff;
    font-size: 10.5px;
    font-weight: bold;
  }
  .nl .nt { font-size: 12px; color: #6f7f7c; }
  .well {
    margin-top: 5px;
    height: 50px;
    border-radius: 11px;
    background: #fffdf6;
    border: 1.5px solid #f0e2bd;
    box-shadow: inset 0 2px 6px rgba(140, 110, 30, .08);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .big {
    font-family: Verdana, sans-serif;
    font-size: 37px;
    font-weight: bold;
    line-height: 1;
    letter-spacing: 1px;
    color: #a8720a;
  }
  .big.empty { font-size: 28px; color: #c9c2ad; }
  .well.no { animation: shk .35s ease; }
  @keyframes shk {
    0%, 100% { transform: none; }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ---------- check button ---------- */
  .chk {
    flex: none;
    margin-top: 7px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #12a37a, #0b7a59);
    color: #fff;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: bold;
    letter-spacing: .3px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(13, 138, 100, .26);
  }
  .chk:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(13, 138, 100, .22); }
  .chk:focus { outline: none; }
  .chk:focus-visible { outline: 3px solid rgba(75, 155, 232, .45); outline-offset: 2px; }

  /* ---------- answer ---------- */
  .res {
    flex: none;
    margin-top: 7px;
    height: 108px;
    box-sizing: border-box;
    padding: 9px 11px 8px;
    border-radius: 13px;
    background: #fbfdfc;
    border: 1px dashed #d9e6e3;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .res.prime { background: #fffdf4; border: 1px solid #f0d795; }
  .res.comp { background: #f7fdfa; border: 1px solid #bfe8d4; }
  .res.one { background: #faf8ff; border: 1px solid #ddd9ea; }
  .res.pop { animation: rpop .26s ease; }
  @keyframes rpop {
    0% { opacity: .35; transform: translateY(3px) scale(.99); }
    100% { opacity: 1; transform: none; }
  }
  .rmid {
    text-align: center;
    font-size: 12px;
    line-height: 1.55;
    color: #8fa19d;
  }
  .rh { display: flex; align-items: center; gap: 7px; height: 23px; }
  .rpill {
    height: 23px;
    padding: 0 9px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    font-size: 12.5px;
    font-weight: bold;
  }
  .res.prime .rpill { background: #fff2cf; border: 1px solid #f0cf82; color: #a8720a; }
  .res.comp .rpill { background: #e7f7ef; border: 1px solid #b6e3cf; color: #0d7a5e; }
  .res.one .rpill { background: #f1f0f6; border: 1px solid #ddd9ea; color: #6f6490; }
  .rnote {
    margin-left: auto;
    font-family: Verdana, sans-serif;
    font-size: 10.5px;
    color: #96a5a2;
  }
  .rchips { display: flex; flex-wrap: wrap; gap: 3px 2px; margin-top: 6px; min-height: 24px; align-content: flex-start; }
  .rchip {
    min-width: 24px;
    height: 23px;
    padding: 0 3px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid #e6dcc0;
    font-family: Verdana, sans-serif;
    font-size: 11px;
    font-weight: bold;
    color: #6f6042;
  }
  .res.prime .rchip { border-color: #eed9a4; color: #8a5b00; }
  .res.comp .rchip { border-color: #cbe9da; color: #2b6d5d; }
  .res.one .rchip { border-color: #e0dcec; color: #6f6490; }
  .rchips.sm { gap: 2px 1px; margin-top: 5px; }
  .rchips.sm .rchip {
    min-width: 16px;
    height: 18px;
    padding: 0 1px;
    border-radius: 4px;
    font-size: 9px;
  }
  .rmsg { margin-top: 5px; font-size: 11.5px; line-height: 1.3; color: #657673; }

  /* ---------- keypad ---------- */
  .plab {
    flex: none;
    margin-top: 8px;
    height: 15px;
    display: flex;
    align-items: center;
    font-size: 11.5px;
    color: #6f7f7c;
  }
  .plab b { color: #0d6d74; }
  .plab .pr { margin-left: auto; font-family: Verdana, sans-serif; font-size: 10.5px; color: #a3b1ae; }
  .pad {
    flex: none;
    margin-top: 4px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .key {
    height: 48px;
    border-radius: 11px;
    border: 1px solid #dcebe7;
    background: linear-gradient(180deg, #ffffff, #f4fbf8);
    font-family: Verdana, sans-serif;
    font-size: 18px;
    font-weight: bold;
    color: #2c4c53;
    cursor: pointer;
    box-shadow: 0 2px 3px rgba(30, 70, 70, .06);
  }
  .key:active { transform: translateY(1px); background: #e9f7f1; }
  .key:focus { outline: none; }
  .key:focus-visible { outline: 2px solid #4b9be8; outline-offset: 1px; }
  .key.fn {
    font-size: 14px;
    color: #a0536b;
    background: linear-gradient(180deg, #fff, #fdf5f7);
    border-color: #f0dfe4;
  }
  .key.fn.c { color: #b0456a; }

  /* ---------- footer note ---------- */
  .tip {
    flex: none;
    margin-top: 7px;
    padding: 6px 10px;
    border-radius: 11px;
    background: #f2fbf7;
    border: 1px solid #d5eee6;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 11px;
    line-height: 1.4;
    color: #4f6462;
  }
  .tip .k {
    flex: none;
    margin-top: 1px;
    height: 17px;
    padding: 0 6px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    background: #0d8a64;
    color: #fff;
    font-size: 9.5px;
    font-weight: bold;
  }
  .tip b { font-family: Verdana, sans-serif; }
</style>
</head>
<body class="en">
<div class="sheet">

  <div class="ttl">Is It a Prime Number?</div>
  <div class="sub">IS IT A PRIME NUMBER?</div>

  <div class="ncard">
    <div class="nl">
      <span class="nb">Number</span>
      <span class="nt">Is this a prime number?</span>
    </div>
    <div class="well" id="well"><span class="big" id="big">17</span></div>
  </div>

  <button class="chk" id="chk" type="button">Check if prime</button>

  <div class="res" id="res">
    <div class="rmid">Tap the Check button.<br>It shows the factors too.</div>
  </div>

  <div class="plab">
    <span>Type a number — keys <b>0 – 9</b></span>
    <span class="pr">1 – 999</span>
  </div>

  <div class="pad" id="pad">
    <button class="key" type="button" data-d="1">1</button>
    <button class="key" type="button" data-d="2">2</button>
    <button class="key" type="button" data-d="3">3</button>
    <button class="key" type="button" data-d="4">4</button>
    <button class="key" type="button" data-d="5">5</button>
    <button class="key" type="button" data-d="6">6</button>
    <button class="key" type="button" data-d="7">7</button>
    <button class="key" type="button" data-d="8">8</button>
    <button class="key" type="button" data-d="9">9</button>
    <button class="key fn" type="button" data-del="1">←</button>
    <button class="key" type="button" data-d="0">0</button>
    <button class="key fn c" type="button" data-clr="1">Clear</button>
  </div>

  <div class="tip">
    <span class="k">How?</span>
    <span>Check whether the number divides by primes such as <b>2, 3, 5, 7, 11</b>.<br>If it divides, it is not prime.</span>
  </div>

</div>

<script>
(function () {
  var big = document.getElementById('big');
  var well = document.getElementById('well');
  var res = document.getElementById('res');
  var chk = document.getElementById('chk');
  var pad = document.getElementById('pad');

  var value = '17';
  var fresh = true;

  function factors(n) {
    var a = [];
    for (var i = 1; i <= n; i++) if (n % i === 0) a.push(i);
    return a;
  }

  function showNumber() {
    if (value === '') {
      big.textContent = '—';
      big.classList.add('empty');
    } else {
      big.textContent = value;
      big.classList.remove('empty');
    }
  }

  function idle(msg) {
    res.className = 'res';
    res.innerHTML = '<div class="rmid">' + msg + '</div>';
  }

  function result() {
    if (value === '') {
      idle('First type a number.');
      well.classList.remove('no');
      void well.offsetWidth;
      well.classList.add('no');
      return;
    }

    var n = parseInt(value, 10);
    var f = factors(n);
    var kind = f.length === 1 ? 'one' : (f.length === 2 ? 'prime' : 'comp');
    var name = kind === 'prime' ? 'Prime' : 'Not prime';
    var msg;

    if (kind === 'prime') {
      msg = 'Divisible only by 1 and ' + n + '.';
    } else if (kind === 'one') {
      msg = '1 is neither prime nor composite.';
    } else {
      msg = 'It has factors other than 1 and ' + n + '.';
    }

    var chips = '';
    f.forEach(function (d) {
      chips += '<span class="rchip">' + d + '</span>';
    });

    res.className = 'res ' + kind;
    res.innerHTML =
      '<div class="rh"><span class="rpill">' + name + '</span>' +
      '<span class="rnote">' + f.length + ' factors</span></div>' +
      '<div class="rchips' + (f.length > 12 ? ' sm' : '') + '">' + chips + '</div>' +
      '<div class="rmsg">' + msg + '</div>';

    void res.offsetWidth;
    res.classList.add('pop');
    fresh = true;
  }

  function edited() {
    showNumber();
    idle('The number changed.<br>Tap the Check button again.');
  }

  function digit(d) {
    if (fresh) { value = ''; fresh = false; }
    if (value === '' && d === '0') return;
    if (value.length >= 3) return;
    value += d;
    edited();
  }

  function back() {
    fresh = false;
    value = value.slice(0, -1);
    edited();
  }

  function clearAll() {
    value = '';
    fresh = false;
    edited();
  }

  pad.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.key') : null;
    if (!b) return;
    if (b.dataset.d !== undefined) digit(b.dataset.d);
    else if (b.dataset.del) back();
    else if (b.dataset.clr) clearAll();
  });

  chk.addEventListener('click', result);

  showNumber();
})();
</script>
</body>
</html>
